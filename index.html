<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión Constructora — v2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<style>
:root{--navy:#2D3748;--acc:#2B6CB0;--verde:#DBF0C3;--verdeB:#375623;--perla:#EFF3F7;--tot:#D4E3F4;
--ink:#1F2A44;--gris:#718096;--arena:#F1ECE1;--celeste:#DFEAF3;--menta:#EDF2E7;--salvia:#DFEBD5;--lav:#E9E6F2;}
*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI",Calibri,system-ui,sans-serif;color:var(--ink);background:#fff}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--acc)}
.home{background:var(--navy);color:#fff;border:none;font-size:18px;padding:6px 12px;cursor:pointer}
h1{font-family:"Calibri Light","Segoe UI Light",sans-serif;font-weight:300;font-size:26px;letter-spacing:.5px}
#volver{margin-left:auto;background:none;border:1px solid var(--acc);color:var(--acc);padding:5px 12px;cursor:pointer}
.lupaBtn{display:none;background:none;border:none;font-size:17px;cursor:pointer;line-height:1;padding:4px 6px;filter:grayscale(1) opacity(.65)}
.lupaBtn:hover{filter:none}
.lupaBtn.on{filter:none}
.busq{display:none;width:280px;border:1px solid var(--acc);font-size:13px}
.nRes{display:none;font-size:12px;color:var(--gris);font-weight:700}
.menuGrid{display:grid;grid-template-columns:1fr 340px;gap:26px;padding:20px;max-width:1180px}
.grupo{font-weight:700;margin:16px 0 6px;color:var(--ink)}
.btn{display:block;width:100%;max-width:320px;text-align:left;padding:11px 14px;margin:7px 0;border:none;
color:#fff;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:.3px}
.btn.verde{background:var(--verdeB)}.btn.navy{background:#1F4E79}.btn.carbon{background:var(--navy)}
.btn:hover{filter:brightness(1.15)}
.panel{background:var(--perla);padding:14px 16px;height:fit-content}
.panelTit{font-weight:700;border-bottom:2px solid var(--acc);padding-bottom:6px;margin-bottom:10px}
.sl{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.sl.total{border-top:2px solid var(--acc);margin-top:8px;padding-top:8px;font-size:16px}
.sl .neg{color:#C0392B}
.kpi{background:#fff;margin-top:12px;padding:8px 10px}
.kpi b{display:block;text-align:right;font-size:17px}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:#fafbfc;border-bottom:1px solid #dde3ea;position:sticky;top:0}
.mini{background:var(--verdeB);color:#fff;border:none;padding:8px 14px;font-weight:700;cursor:pointer}
select,input{padding:7px 9px;border:1px solid #c3ccd6;font-size:13px;background:#fff}
.sigma{margin-left:auto;display:flex;align-items:flex-end;gap:14px;font-size:13px;color:var(--gris)}
.sgTit{font-weight:700;letter-spacing:.4px;padding-bottom:1px}
.mx{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.mx small{font-size:10px;letter-spacing:.5px;color:var(--gris)}
.mx b{color:var(--ink);font-variant-numeric:tabular-nums}
.sigma .tot{color:var(--acc)}
.alerta{background:#FDF0E0;color:#9A5B13;font-weight:700;padding:2px 8px;margin-left:8px}
.tablaWrap{overflow:auto;max-height:calc(100vh - 130px)}
table.carga{border-collapse:collapse;font-size:12.5px;table-layout:fixed;width:max-content;min-width:100%}
.carga th{background:var(--navy);color:#fff;padding:7px 6px;position:sticky;top:0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;line-height:1.2;text-align:left}
.carga th.num{text-align:right}
.carga td{padding:5px 6px;border-bottom:1px solid #e8edf2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carga tr:nth-child(even){background:#f7f9fb}
.num{text-align:right;font-variant-numeric:tabular-nums}
.g{color:var(--gris);font-style:italic}
.tot{background:var(--tot);font-style:italic}
.neg{color:#C0392B}
.zA{background:var(--arena)} .zB{background:#E7DFCC} .zF{background:var(--celeste)}
.zV{background:var(--menta)} .zS{background:var(--salvia)} .zL{background:var(--lav)}
.cards{display:none;padding:10px}
.card{border:1px solid #dde3ea;border-left:4px solid var(--acc);padding:9px 12px;margin:8px 0;background:#fff}
.cTop{display:flex;justify-content:space-between;gap:8px}
.cSub{color:var(--gris);font-size:12.5px;margin-top:3px}
.modal{position:fixed;inset:0;background:rgba(20,28,45,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.oculto{display:none!important}
.mBox{background:#fff;max-width:840px;width:94%;max-height:92vh;overflow:auto;padding:18px 20px}
.mTit{font-weight:700;font-size:16px;border-bottom:2px solid var(--acc);padding-bottom:8px;margin-bottom:14px;display:flex;justify-content:space-between}
.x{cursor:pointer;color:var(--gris);display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;font-size:16px;line-height:1;flex:0 0 auto;margin:-4px -4px -4px 0}
.x:hover{background:#F1F4F8;color:var(--ink)}
.fRow{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;margin-bottom:9px}
.fRow label{display:flex;flex-direction:column;font-size:11px;font-weight:700;color:var(--gris);gap:3px;min-width:0}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}
.chk{text-align:center;padding:0!important}
.chk input{cursor:pointer;width:14px;height:14px;margin:0;vertical-align:middle}
.mini.del{background:#9B2C2C}
.mini.ed{background:var(--acc)}
.mini.ok{background:#1F4E79}
.mini.gris{background:#718096}
.mini[disabled]{background:#c3ccd6;cursor:default}
.mod{color:var(--acc);font-style:normal;margin-right:2px;cursor:help}
input.numIn{text-align:right;font-variant-numeric:tabular-nums}
.carga tbody tr{cursor:pointer}
.carga tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.mBtns{display:flex;gap:10px;margin-top:4px}
.mBtns .btn{max-width:260px;margin:0}
.btn.gris{background:#718096}
#alta.vista input,#alta.vista select{background:#fff;color:var(--ink);opacity:1}
#alta.vista .ziA{background:var(--arena)}#alta.vista .ziB{background:#E7DFCC}#alta.vista .ziF{background:var(--celeste)}
#alta.vista .ziV{background:var(--menta)}#alta.vista .ziS{background:var(--salvia)}#alta.vista .ziL{background:var(--lav)}
table.audi{table-layout:auto;width:100%;min-width:0}
table.audi th{position:static}

.totIn{background:var(--tot)!important;font-weight:700;text-align:right}
.err{color:#C0392B;font-weight:700;margin:10px 0;min-height:18px}
@media(max-width:760px){
 .menuGrid{grid-template-columns:1fr}
 .tablaWrap{display:none}
 .cards{display:block}
 h1{font-size:19px}
 .sigma{width:100%;margin-left:0}
}

.tresCol{display:grid;grid-template-columns:repeat(3,minmax(180px,240px));gap:22px}
.dosCol{display:grid;grid-template-columns:repeat(2,minmax(200px,300px));gap:22px;margin-top:10px}
.btn.azul{background:#1F4E79}
.ziA{background:var(--arena)!important}
.ziB{background:#E7DFCC!important}
.ziF{background:var(--celeste)!important}
.ziV{background:var(--menta)!important}
.ziS{background:var(--salvia)!important}
.ziL{background:var(--lav)!important}
@media(max-width:760px){.tresCol,.dosCol{grid-template-columns:1fr}
 .fRow{grid-template-columns:repeat(2,1fr)}
 .fRow>label{grid-column:span 1!important}}
/* ===== PARTE DIARIO MÓVIL ===== */
.mob{display:flex;justify-content:center;padding:10px 8px;background:#EDF1F5}
.mScr{width:100%;max-width:412px;background:#fff;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;
  height:calc(100vh - 88px);height:calc(100dvh - 88px);max-height:900px;
  box-shadow:0 10px 34px rgba(20,28,45,.16);color:var(--ink)}
.mHead{background:var(--navy);color:#fff;padding:16px 18px 15px;flex:0 0 auto}
.mDow{font-size:14px;letter-spacing:3px;font-weight:700;color:var(--verde)}
.mFecha{font-size:31px;font-weight:700;letter-spacing:-.4px;line-height:1.12;margin-top:1px}
.mFecha small{font-size:19px;font-weight:400;opacity:.62}
.mObra{margin-top:12px;background:rgba(255,255,255,.11);border-radius:9px;padding:7px 12px}
.mObra span{opacity:.62;font-size:10px;letter-spacing:1.2px;display:block;font-weight:700}
.mObra select{background:none;border:none;color:#fff;font-size:16px;font-weight:600;padding:0;width:100%}
.mObra select option{color:var(--ink)}
.mQuien{font-size:11.5px;color:#A8B6C6;margin-top:9px;letter-spacing:.3px}
.mKpis{display:flex;gap:9px;padding:13px 15px 0}
.mKpi{flex:1;border:1px solid #E4E9EF;border-radius:11px;padding:8px 12px}
.mKpi small{display:block;font-size:10px;letter-spacing:1.1px;color:var(--gris);font-weight:700}
.mKpi b{font-size:27px;font-weight:700;line-height:1.15}
.mKpi.amb{background:#FDF0DC;border-color:#F0DCBB}.mKpi.amb b{color:#B7791F}
.mKpi.ver{background:#F1F8E9;border-color:#D6E7BE}.mKpi.ver b{color:var(--verdeB)}
.mTotal{margin:11px 15px 0;background:var(--navy);color:#fff;border-radius:13px;padding:12px 16px;display:flex;align-items:flex-end;justify-content:space-between}
.mTotal small{font-size:10px;letter-spacing:1.3px;opacity:.65;font-weight:700;display:block}
.mTotal b{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums}
.mLista{flex:1;padding:11px 15px 0;overflow:auto}
.mFila{display:flex;align-items:center;gap:11px;padding:11px;border-radius:11px;margin-bottom:7px;
       border:1px solid #E4E9EF;border-left:5px solid #E4E9EF;background:#fff;cursor:pointer}
.mFila.pre{border-left-color:#B7791F;background:#FEFAF3}
.mFila.lis{border-left-color:var(--verdeB);background:#F6FBEF}
.mFila.sel{border-color:#BBD3EA;border-left-color:var(--acc);background:#F2F7FC}
.mLeg{width:44px;height:44px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;
      justify-content:center;font-size:15px;font-weight:700;flex:0 0 auto}
.mNom{flex:1;min-width:0}
.mNom b{display:block;font-size:16.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mNom small{font-size:11.5px;color:var(--gris);letter-spacing:.4px}
.mHs{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.mHs small{display:block;font-size:9.5px;letter-spacing:1.1px;color:var(--gris);font-weight:700}
.mHs.ok{color:var(--verdeB)}.mHs.amb{color:#B7791F}
.mBsal{background:var(--acc);color:#fff;border:none;border-radius:9px;padding:11px 13px;font-size:12.5px;font-weight:700;letter-spacing:.6px}
.mTick{width:30px;height:30px;border-radius:8px;border:2px solid #C3CCD6;flex:0 0 auto;display:flex;align-items:center;
       justify-content:center;font-size:17px;color:#fff;font-weight:700}
.mTick.on{background:var(--verdeB);border-color:var(--verdeB)}
.mBuscar{margin:0 15px 11px;display:block;width:calc(100% - 30px);border:2px solid #E4E9EF;border-radius:12px;padding:12px 14px;font-size:16px}
.mChips{display:flex;gap:8px;padding:0 15px 4px;flex-wrap:wrap}
.mChip{border:1.5px solid #E4E9EF;border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--gris);cursor:pointer}
.mChip.on{background:var(--verde);border-color:#B9D98C;color:var(--verdeB)}
.mHbar{margin:0 15px 11px;background:#F4F7FA;border:1px solid #E4E9EF;border-radius:12px;padding:9px 14px;
       display:flex;align-items:center;justify-content:space-between}
.mEt{font-size:10px;letter-spacing:1.2px;color:var(--gris);font-weight:700}
.mReloj{display:flex;align-items:flex-start;gap:4px}
.mRw{display:flex;flex-direction:column;align-items:center}
.mReloj select{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;border:none;background:none;
  padding:0 2px;-webkit-appearance:none;appearance:none;text-align:center;color:var(--ink);line-height:1.05}
.mReloj em{font-size:9px;letter-spacing:1.4px;color:var(--gris);font-weight:700;font-style:normal;margin-top:-2px}
.mReloj i{font-size:30px;font-weight:700;font-style:normal;line-height:1.1}
.mStep{display:flex;gap:7px}
.mStep b{width:42px;height:42px;border-radius:10px;border:1.5px solid #C3CCD6;display:flex;align-items:center;
         justify-content:center;font-size:21px;color:var(--navy);background:#fff;cursor:pointer}
.mPie{flex:0 0 auto;padding:11px 15px 16px;border-top:1px solid #E4E9EF;background:#fff;display:flex;gap:9px}
.mBt{flex:1;border:none;border-radius:13px;padding:17px 10px;font-size:16.5px;font-weight:700;letter-spacing:.5px;color:#fff;cursor:pointer}
.mBt.v{background:var(--verdeB)}.mBt.a{background:var(--acc)}
.mBt.g{background:#fff;color:var(--navy);border:2px solid #C3CCD6}
.mBt[disabled]{background:#C3CCD6}
.mBt small{display:block;font-size:11px;font-weight:600;opacity:.82;letter-spacing:.6px;margin-top:2px}
.mVacio{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:46px 40px;gap:11px}
.mIc{width:74px;height:74px;border-radius:50%;border:3px dashed #C3CCD6}
.mVacio b{font-size:17px}.mVacio p{font-size:14px;color:var(--gris);line-height:1.5}
/* ===== PLAN DE CUENTAS ===== */
.pcWrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding:18px;align-items:start}
.pcCard{border:1px solid #E4E9EF;border-radius:12px;overflow:hidden;background:#fff}
.pcTit{background:var(--perla);border-bottom:2px solid var(--acc);padding:9px 13px;font-size:12px;font-weight:700;
       letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
.pcTit span{background:var(--navy);color:#fff;border-radius:11px;padding:1px 9px;font-size:11px}
.pcLista{padding:7px 13px 10px}
.pcIt{font-size:13.5px;padding:4px 0;border-bottom:1px solid #F1F4F8}
.pcIt:last-child{border:none}
.pcNota{font-size:11.5px;color:var(--gris);padding:0 13px 11px;line-height:1.45}
.pcCard.pcCap{grid-column:span 2;border-color:#B9D98C}
.pcCap .pcTit{background:var(--verde);border-bottom-color:var(--verdeB)}
.pcCap1{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #F1F4F8}
.pcNom{flex:1;font-size:17px;font-weight:700;letter-spacing:.4px}
.pcClave{font-size:10.5px;letter-spacing:1.2px;color:var(--gris);font-weight:700}
.pcClave b{font-size:18px;color:var(--ink);letter-spacing:3px;margin-left:6px;font-variant-numeric:tabular-nums}
.pcDel{background:none;border:1px solid #E3BDBD;color:#9B2C2C;border-radius:8px;width:32px;height:32px;font-size:14px;cursor:pointer}
.pcAlta{display:flex;gap:8px;padding:4px 13px 0}
.pcAlta input{flex:1;padding:9px 11px;border:1px solid #c3ccd6;font-size:14px}
.pcAlta #cap_pin{max-width:92px;letter-spacing:3px;text-align:center}
.pcAdd{background:var(--verdeB);color:#fff;border:none;padding:9px 16px;font-weight:700;font-size:13px;letter-spacing:.5px;cursor:pointer}
.pcErr{color:#C0392B;font-weight:700;font-size:12.5px;padding:6px 13px 0;min-height:14px}
@media(max-width:640px){.pcCard.pcCap{grid-column:span 1}.pcAlta{flex-wrap:wrap}}
/* ===== LOGIN MÓVIL ===== */
.mLogin{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 20px 16px;overflow:auto}
.mLtit{font-size:12px;letter-spacing:2.6px;color:var(--gris);font-weight:700}
.mLpre{font-size:26px;font-weight:700;margin:5px 0 18px}
.mCapRow{display:flex;align-items:center;gap:12px;border:2px solid #E4E9EF;border-radius:13px;padding:12px;
         margin-bottom:9px;font-size:17px;font-weight:600;cursor:pointer}
.mCapRow.on{border-color:var(--verdeB);background:#F6FBEF}
.mPin{display:flex;gap:11px;justify-content:center;margin:20px 0 4px}
.mPin i{width:17px;height:17px;border-radius:50%;border:2px solid #C3CCD6;display:block}
.mPin i.f{background:var(--navy);border-color:var(--navy)}
.mErr{color:#C0392B;font-weight:700;font-size:13px;text-align:center;min-height:20px;margin-bottom:6px}
.mTeclas{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:auto}
.mTeclas b{background:#F4F7FA;border-radius:13px;padding:16px;text-align:center;font-size:24px;font-weight:600;cursor:pointer}
.mTeclas b.vac{background:none}
.mSalir{background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:8px;padding:5px 11px;font-size:11px;font-weight:700;letter-spacing:.6px;cursor:pointer}
.mPaso{font-size:11px;letter-spacing:1.4px;color:#A8B6C6;margin-top:9px;font-weight:700}
.mKpi.nav{background:var(--navy);border-color:var(--navy)}.mKpi.nav small{color:#A8B6C6}.mKpi.nav b{color:#fff}
.mGrupo{display:flex;justify-content:space-between;align-items:baseline;margin:10px 2px 7px;
        border-bottom:2px solid var(--acc);padding-bottom:4px}
.mGrupo span{font-size:13px;font-weight:700;letter-spacing:.6px}
.mGrupo b{font-size:11px;letter-spacing:.8px;color:var(--gris)}
.mObraCard{display:flex;align-items:center;gap:12px;padding:15px 13px;border-radius:12px;margin-bottom:9px;
           border:2px solid #E4E9EF;background:#fff;cursor:pointer}
.mObraCard.on{border-color:var(--verdeB);background:#F6FBEF}
.mObraCard .mNom b{font-size:18px}
.mSelObra{font-size:19px;font-weight:700;border:none;background:none;padding:2px 0;width:100%;color:var(--ink)}
.mAviso{background:#FDF0DC;border:1px solid #F0DCBB;color:#8A5B12;border-radius:10px;padding:11px 13px;
        font-size:12.5px;font-weight:600;line-height:1.4;margin-top:6px}
.mPie{flex-wrap:wrap}
.mBt.wfull{flex:0 0 100%}
.coWrap{padding:16px;display:flex;flex-direction:column;gap:16px;max-width:1500px}
.coCard{border:1px solid #E4E9EF;border-radius:12px;overflow:hidden;background:#fff}
.coTab{border-collapse:collapse;width:100%;font-size:13px}
.coTab th{background:var(--perla);color:var(--ink);padding:8px 10px;font-size:10.5px;letter-spacing:.8px;
          border-bottom:2px solid var(--acc);text-align:left;white-space:nowrap}
.coTab th.num,.coTab td.num{text-align:right;font-variant-numeric:tabular-nums}
.coTab td{padding:7px 10px;border-bottom:1px solid #F1F4F8;vertical-align:middle}
.coTab tr:nth-child(even) td{background:#FAFCFE}
.coTab tr.coTot td{background:var(--tot);font-weight:700;border-top:2px solid var(--acc);border-bottom:none}
.coTab small.g{font-size:10.5px}
.coImp{width:130px;padding:6px 8px;border:1px solid #c3ccd6;font-size:13px}
.coLab{display:flex;flex-direction:column;font-size:9.5px;font-weight:700;letter-spacing:1px;color:var(--gris);gap:3px}
.coLab input,.coLab select{font-size:13px}
.coLab .numIn{width:130px}
.coGenF{display:flex;gap:12px;align-items:flex-end;padding:12px 13px 4px;flex-wrap:wrap}
.coGen{border-color:#B9D98C}
.coGen .pcTit{background:var(--verde);border-bottom-color:var(--verdeB)}
.pdAvisos{display:flex;flex-wrap:wrap;gap:9px;padding:11px 16px 0}
.pdAv{font-size:12.5px;font-weight:700;border-radius:8px;padding:7px 12px;border:1px solid}
.pdAv.amb{background:#FDF0DC;border-color:#F0DCBB;color:#8A5B12}
.pdAv.rojo{background:#FDECEC;border-color:#EBC4C4;color:#9B2C2C}
.pdAv.gris{background:#F1F4F8;border-color:#E4E9EF;color:#5A6676}
.pdTab td{vertical-align:middle}
.pdIn{width:100%;border:1px solid transparent;background:none;padding:3px 4px;font-size:12.5px}
.pdIn:focus{border-color:var(--acc);background:#fff;outline:none}
.pdIn.pte{background:#FDF0DC;border-color:#E9C99A;font-weight:700}
.pdIn.pte::placeholder{color:#B7791F;font-weight:600;font-style:italic}
td.pdPte{background:#FDF0DC!important;box-shadow:inset 3px 0 0 #B7791F}

function renderConFoco(fn){
  const a=document.activeElement, id=a&&a.id;
  let pos=null; try{ pos=a&&a.selectionStart; }catch(_){}
  fn();

  const e=$("#"+id); if(!e) return;
  e.focus(); if(pos!=null){ try{ e.setSelectionRange(pos,pos); }catch(_){} }

function leerForm(){
  const v=id=>{ const e=$("#a_"+id); return e?e.value.trim():""; };
  const o = { cuenta:v("cuenta"), tipo:v("tipo")||null, cbte:v("cbte")||null, cheque:v("cheque")||null, tcbte:v("tcbte")||null,
    emis:v("emis"), pago:v("pago"), cant:parseFloat(v("cant"))||null, concepto:v("concepto"),
    prov:v("prov")||null, ctadest:v("ctadest")||null,
    neto:impv("a_neto"), iva:impv("a_iva"), ivarp:impv("a_ivarp"), gcia:impv("a_gcia"), iibb:impv("a_iibb"),
    categ:v("categ")||null, sub:v("sub")||null, obra:v("obra")||null, etapa:v("etapa")||null };
  const err=[];
  if(!o.cuenta) err.push("cuenta");
  if(!o.concepto) err.push("concepto");
  if(!o.emis||!o.pago) err.push("fechas");
  if(!o.neto) err.push("neto");
  const esDes = o.cuenta==="DESACOPIO";
  if(esDes){
    if(!o.obra) err.push("obra: el desacopio existe para imputar el gasto a una obra");
    if(!o.categ) err.push("categoría");
    if(!o.prov) err.push("proveedor");
    if(o.iva||o.ivarp||o.gcia||o.iibb) err.push("el desacopio no lleva IVA ni retenciones: ya se computaron en el acopio");
    if(err.length){ $("#a_err").textContent="Falta / revisar: "+err.join(" · "); }
    return {o,err};
  }
  const esMov = o.tcbte==="M.INT.";
  if(esMov && !o.ctadest) err.push("cuenta de destino");
  if(esMov && o.ctadest===o.cuenta) err.push("origen y destino no pueden ser la misma cuenta");
  if(!esMov && !o.prov) err.push("proveedor");
  if(!esMov && !o.categ) err.push("categoría");
  return {o,err};
}

/* ---------- IMÁGENES DE EJEMPLO ----------

function lienzo(w,h){ const c=document.createElement("canvas"); c.width=w; c.height=h; return [c,c.getContext("2d")]; }
function caraDemo(leg,nom,W,H){
  const [c,x]=lienzo(W,H);
  const tono=(leg*47)%360;
  const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`hsl(${tono},32%,74%)`); g.addColorStop(1,`hsl(${tono},30%,58%)`);
  x.fillStyle=g; x.fillRect(0,0,W,H);
  const cx=W/2, piel=`hsl(${(tono+18)%360},34%,${72-(leg%5)*4}%)`;
  x.fillStyle=`hsl(${tono},26%,${40-(leg%3)*5}%)`;            // hombros
  x.beginPath(); x.ellipse(cx,H*1.02,W*0.42,H*0.34,0,Math.PI,0); x.fill();
  x.fillStyle=piel;                                            // cuello y cabeza
  x.fillRect(cx-W*0.09,H*0.52,W*0.18,H*0.16);
  x.beginPath(); x.arc(cx,H*0.44,W*0.21,0,Math.PI*2); x.fill();
  x.fillStyle=`hsl(${(tono+200)%360},22%,${22+(leg%4)*6}%)`;   // pelo
  x.beginPath(); x.arc(cx,H*0.40,W*0.215,Math.PI*1.06,Math.PI*1.94); x.fill();
  if(leg%3===0){ x.fillRect(cx-W*0.215,H*0.40,W*0.43,H*0.045); } // gorra
  x.fillStyle="rgba(255,255,255,.9)"; x.font=`bold ${Math.round(W*0.11)}px sans-serif`;
  x.textAlign="left"; x.fillText(String(leg),W*0.07,H*0.95);
  return c.toDataURL("image/jpeg",0.72);
}
function dniDemo(leg,nom,cuil,cat,frente,W,H){

  x.strokeStyle="#C8D2DC"; x.lineWidth=2; x.strokeRect(3,3,W-6,H-6);
  x.fillStyle="#2D4A7A"; x.fillRect(3,3,W-6,H*0.16);

  if(frente){

    x.beginPath(); x.ellipse(12+fw/2,H*0.90,fw*0.42,H*0.24,0,Math.PI,0); x.fill();

function lgFoto(l,campo,inp,W,H){
  const f=inp.files&&inp.files[0]; if(!f) return;
  if(!/^image\//.test(f.type)){ alert("El archivo tiene que ser una imagen."); return; }
  const rd=new FileReader();
  rd.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement("canvas"); c.width=W; c.height=H;
      const ra=img.width/img.height, rb=W/H;
      let sw=img.width, sh=img.height, sx=0, sy=0;
      if(ra>rb){ sw=img.height*rb; sx=(img.width-sw)/2; } else { sh=img.width/rb; sy=(img.height-sh)/2; }
      c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,W,H);
      DB.run(`UPDATE operario SET ${campo}=? WHERE legajo=?`,[c.toDataURL("image/jpeg",0.72),l]);
      DB.run("INSERT INTO audit(ts,usuario,accion,mov_id,campo,antes,despues) VALUES(?,?,?,?,?,?,?)",
        [ahora(),USUARIO,"LEGAJO",l,campo,"","cargada"]);
      renderLegajos();
    };
    img.onerror=()=>alert("No se pudo leer la imagen.");
    img.src=e.target.result;
  };
  rd.readAsDataURL(f);
}
function lgQuitarFoto(l,campo){
  if(!confirm("¿Quitar esta imagen?")) return;
  DB.run(`UPDATE operario SET ${campo}=NULL WHERE legajo=?`,[l]);
  DB.run("INSERT INTO audit(ts,usuario,accion,mov_id,campo,antes,despues) VALUES(?,?,?,?,?,?,?)",
    [ahora(),USUARIO,"LEGAJO",l,campo,"cargada",""]);
  renderLegajos();
}

function lgSet(l,campo,v){
  const ant=q("SELECT * FROM operario WHERE legajo=?",[l])[0];
  DB.run(`UPDATE operario SET ${campo}=? WHERE legajo=?`,[v||null,l]);
  DB.run("INSERT INTO audit(ts,usuario,accion,mov_id,campo,antes,despues) VALUES(?,?,?,?,?,?,?)",
    [ahora(),USUARIO,"LEGAJO",l,campo,String(ant[campo]??""),String(v??"")]);
  renderLegajos();
}

  $("#lg_leg").value=n; $("#lg_nom").value=""; $("#lg_cuil").value=""; $("#lg_ing").value=hoy;

function lgGuardar(){
  const v=i=>$("#lg_"+i).value.trim();
  const leg=parseInt(v("leg"))||0, err=[];
  if(!leg) err.push("legajo");
  if(leg && q("SELECT 1 x FROM operario WHERE legajo=?",[leg]).length) err.push("ese legajo ya existe");
  if(!v("nom")) err.push("apellido y nombre");
  if(!v("ing")) err.push("fecha de ingreso");
  if(err.length){ $("#lg_err").textContent="Falta / revisar: "+err.join(" · "); return; }
  DB.run("INSERT INTO operario(legajo,nombre,cuil,categoria,ingreso,afiliado,obra) VALUES(?,?,?,?,?,?,?)",
    [leg,v("nom").toUpperCase(),v("cuil")||null,v("cat"),v("ing"),v("afi"),v("obra")||null]);
  DB.run("INSERT INTO audit(ts,usuario,accion,mov_id,campo,antes,despues) VALUES(?,?,?,?,?,?,?)",
    [ahora(),USUARIO,"LEGAJO",leg,"alta","",v("nom").toUpperCase()]);
  LGNEW=leg; lgCerrar(); lgAbrirFicha(leg);
}
function lgBaja(l){
  const n=q("SELECT COUNT(*) c FROM parte WHERE legajo=?",[l])[0].c;
  if(n){ alert(`No se puede dar de baja: tiene ${n} jornada(s) cargadas en partes.\nPrimero hay que resolver esos partes.`); return; }
  if(!confirm("¿Dar de baja este legajo?")) return;
  DB.run("DELETE FROM operario WHERE legajo=?",[l]); if(LGFICHA===l) lgCerrarFicha(); else renderLegajos();
}

/* ==================== GRÁFICOS DEL MES · pantalla interactiva ====================
   Los mismos seis de la hoja impresa, pero cada gajo y cada renglón abre el detalle
   de los asientos que forman ese total. */
function tortasDelMes(){
  const [D,H]=rangoMes(), out=[];
  for(const k of Object.keys(RPT)){
    const R=RPT[k], wh=[GASTO,"pago BETWEEN ? AND ?"];
    if(R.f) wh.push(R.f);
    const fs=q(`SELECT COALESCE(${R.dim},'—') k, SUM(${TOTAL}) t FROM mov WHERE ${wh.join(" AND ")}
      GROUP BY k ORDER BY t DESC`,[D,H]);
    const G=fs.reduce((a,x)=>a+x.t,0);
    if(G) out.push({rk:k, tit:R.tit, et:R.et, total:G, svg:graficoTorta(fs.map(x=>({k:x.k,v:x.t})),G,R.et,true,k)});
  }
  return out;
}
function renderGraficos(){
  if(!RPTMES){ RPTMES=+hoy.slice(5,7); RPTANIO=+hoy.slice(0,4); }
  const anios=q("SELECT DISTINCT substr(pago,1,4) a FROM mov ORDER BY 1").map(x=>+x.a);
  if(!anios.includes(RPTANIO)) RPTANIO=anios[anios.length-1];
  const T=tortasDelMes();
  const banda=(a,b)=>T.slice(a,b).map(t=>`<div class="chPie"><div class="chTit">${t.tit}</div>${t.svg.pie}</div>`).join("")
    + T.slice(a,b).map(t=>`<div class="chLeg">${t.svg.leg}</div>`).join("");
  $("#app").innerHTML=`
  <div class="barra rpBar">
    <span class="certTit">GRÁFICOS DEL MES</span>
    <div class="rpPer">
      <select onchange="RPTMES=+this.value;renderGraficos()">${MESES.map((m,i)=>`<option value="${i+1}" ${i+1===RPTMES?"selected":""}>${m[0]+m.slice(1).toLowerCase()}</option>`).join("")}</select>
      <select onchange="RPTANIO=+this.value;renderGraficos()">${anios.map(a=>`<option ${a===RPTANIO?"selected":""}>${a}</option>`).join("")}</select>
    </div>
    <button class="mini" onclick="dossierGastos()">🖶 PDF</button>
  </div>
  <div class="grafWrap"><div class="hojaCharts grafGrid">${banda(0,3)}${banda(3,6)}</div>
   <div class="rpNota">Tocá cualquier porción o cualquier renglón para ver los asientos que lo forman.</div></div>
  <div id="grafDet"></div>`;
}
/* detalle de los asientos que forman una porción */
function detGraf(rk,k){
  const R=RPT[rk], [D,H]=rangoMes(), pr=[D,H];
  const wh=[GASTO,"pago BETWEEN ? AND ?"];
  if(R.f) wh.push(R.f);
  const W=wh.join(" AND ");
  const tod=q(`SELECT COALESCE(${R.dim},'—') k, SUM(${TOTAL}) t FROM mov WHERE ${W} GROUP BY k ORDER BY t DESC`,pr);
  let cond, extra;
  if(/^otros/.test(k)){
    const top=tod.slice(0,8).map(x=>x.k);
    cond=`COALESCE(${R.dim},'—') NOT IN (${top.map(()=>"?").join(",")})`; extra=top;
  } else { cond=`COALESCE(${R.dim},'—')=?`; extra=[k]; }
  const det=q(`SELECT *, ${TOTAL} tt FROM mov WHERE ${W} AND ${cond} ORDER BY pago DESC, id DESC`,[...pr,...extra]);
  const sN=det.reduce((a,r)=>a+(r.neto||0),0), sT=det.reduce((a,r)=>a+r.tt,0);
  const G=tod.reduce((a,x)=>a+x.t,0);
  $("#grafDet").innerHTML=`<div class="modal" onclick="if(event.target===this)cerrarGraf()"><div class="mBox grafBox">
   <div class="mTit">${k} <small>${R.tit.replace("GASTOS ","")} · ${MESES[RPTMES-1][0]+MESES[RPTMES-1].slice(1).toLowerCase()} ${RPTANIO}</small>
     <span class="x" onclick="cerrarGraf()">✕</span></div>
   ${tarj([["MOVIMIENTOS",det.length],["NETO",sN],["TOTAL",sT,"tt"],["PESO EN EL MES",0].slice(0,2).concat([]) ].slice(0,3).concat([["% DEL MES",Math.round(G?sT/G*1000:0)/10]]))}
   <div class="grafTab"><table class="coTab rpTab2">
    <thead><tr><th class="num">N°</th><th>PAGO</th><th>CUENTA</th><th>CBTE</th><th>CONCEPTO</th>
      <th>PROVEEDOR</th><th>OBRA</th><th>ETAPA</th><th class="num">NETO</th><th class="num">TOTAL</th></tr></thead>
    <tbody>${det.map(r=>`<tr onclick="cerrarGraf();abrirVista(${r.id})">
      <td class="num g">${r.id}</td><td>${(r.pago||"").slice(5)}</td><td>${r.cuenta||""}</td>
      <td>${r.tcbte||""}</td><td>${r.concepto||""}</td><td>${r.prov||""}</td>
      <td>${r.obra||"—"}</td><td>${r.etapa||"—"}</td>
      <td class="num">${fmt(r.neto)}</td><td class="num tot">${fmt(r.tt)}</td></tr>`).join("")}
     <tr class="coTot"><td colspan="8">TOTAL · ${det.length} movimiento${det.length===1?"":"s"}</td>
      <td class="num">${fmt(sN)}</td><td class="num">${fmt(sT)}</td></tr></tbody></table></div>
   <div class="rpNota">Tocá una línea para abrir el asiento completo.</div>
  </div></div>`;
  trabarFondo(true);
}
function cerrarGraf(){ $("#grafDet").innerHTML=""; trabarFondo(false); }

    const fs=q(`SELECT COALESCE(${R.dim},'—') k, SUM(${TOTAL}) t FROM mov WHERE ${wh.join(" AND ")} GROUP BY k ORDER BY t DESC`,[D,H]);
    const G=fs.reduce((a,x)=>a+x.t,0);
    if(G) tortas.push({tit:R.tit, svg:graficoTorta(fs.map(x=>({k:x.k,v:x.t})),G,R.et,true)});
  }
  if(tortas.length){
    /* sin cabecera: la hoja habla sola. El período va grande sobre la línea del tercer título */
    const banda=(a,b,per)=>tortas.slice(a,b).map((t,i)=>`<div class="chPie"><div class="chTit">${t.tit}
        ${per&&i===2?`<span class="chPer">${perMes()}</span>`:""}</div>${t.svg.pie}</div>`).join("")
      + tortas.slice(a,b).map(t=>`<div class="chLeg">${t.svg.leg}</div>`).join("");
    hojas.push(`<div class="hojaCharts sinCab">${banda(0,3,true)}${banda(3,6,false)}</div>`);
  }
  imprimirHojas(hojas,g);
}
function imprimirHojas(hojas,g){
  $("#dossier").innerHTML=hojas.filter(Boolean).map(x=>`<section class="hoja">${x}</section>`).join("");
  document.body.classList.add("imprimiendo");
  const volver=()=>{ document.body.classList.remove("imprimiendo"); $("#dossier").innerHTML="";
    if(g){ RPTTIPO=g.rt; RPTFILA=g.rf; if(g.ft) FINTIPO=g.ft; if(g.fc) FINCTA=g.fc; if(g.fp!==undefined) FINPROY=g.fp; nav(g.v); }
    window.removeEventListener("afterprint",volver); };
  window.addEventListener("afterprint",volver);
  setTimeout(()=>window.print(),60);
}

/* arma un dossier con todos los reportes, uno por hoja */
function dossierPDF(){
  const g={rt:RPTTIPO,rf:RPTFILA,ft:FINTIPO,fc:FINCTA,fp:FINPROY,v:VISTA};
  const hojas=[];
  const tomar=()=>{ const h=$("#app").innerHTML;
    const i=h.indexOf('<div class="rpBox">'); if(i<0) return "";
    const j=h.indexOf('</div></div>',i);
    return h.slice(i+19, j<0?h.length:j); };
  for(const k of Object.keys(RPT)){ RPTTIPO=k; RPTFILA=""; renderRep(); hojas.push(tomar()); }
  RPTFILA="";
  renderCert(); hojas.push(tomar());
  renderFondo(); hojas.push(tomar());
  for(const k of ["flujo","imp","iva","iibb","gcia","ret","acop"]){ FINTIPO=k; FINPROY=""; renderFin(); hojas.push(tomar()); }

  imprimirHojas(hojas,g);
}

/* ==================== FONDO DE RESERVA ====================
   Las previsiones del certificado no son un gasto que salga de caja: son plata que se
   aparta. Este fondo lleva la cuenta corriente — cuánto se reservó mes a mes y cuánto
   se usó al pagar un despido, un juicio o una reparación en garantía.
   Los usos NO vuelven a ser costo del mes: ya se cargaron cuando se previsionaron. */
function reservaMes(m,a){
  const fin=new Date(a,m,0).getDate(), p=n=>String(n).padStart(2,"0");
  const D=`${a}-${p(m)}-01`, H=`${a}-${p(m)}-${fin}`;
  const W=`${GASTO} AND pago BETWEEN ? AND ?`;
  const g=q(`SELECT COALESCE(categ,'—') k, SUM(neto) n FROM mov WHERE ${W} GROUP BY k`,[D,H]);
  const T=g.reduce((x,y)=>x+y.n,0), cat=k=>(g.find(x=>x.k===k)||{n:0}).n;
  if(!T) return null;
  const desp=cat("Mano Obra")*cfgDN("cert_desp")/100;
  const o1=T*cfgDN("cert_o1p")/100, o2=T*cfgDN("cert_o2p")/100;
  const amo=cat("Equipos")*cfgDN("cert_amort")/100;
  return {D,H,mes:m,anio:a,desp,o1,o2,amo,total:desp+o1+o2+amo};
}
function renderFondo(){
  const per=q("SELECT DISTINCT substr(pago,1,7) p FROM mov WHERE pago IS NOT NULL ORDER BY 1").map(x=>x.p);
  const usos=q(`SELECT *, ${TOTAL} tt FROM mov WHERE categ='FONDO RESERVA' ORDER BY pago, id`);
  const ev=[];
  for(const pm of per){
    const [a,m]=pm.split("-").map(Number);
    const r=reservaMes(m,a);
    if(r) ev.push({f:r.H, tipo:"res", txt:`Previsión de ${MESES[m-1][0]+MESES[m-1].slice(1).toLowerCase()} ${a}`,
      det:`despidos ${fmt(r.desp)} · ${cfgD("cert_o1t")} ${fmt(r.o1)} · ${cfgD("cert_o2t")} ${fmt(r.o2)} · amortizaciones ${fmt(r.amo)}`,
      mas:r.total, menos:0, r});
    usos.filter(u=>(u.pago||"").slice(0,7)===pm).forEach(u=>ev.push({f:u.pago, tipo:"uso",
      txt:u.concepto||"—", det:`${u.sub||""} · ${u.prov||""} · ${u.cuenta}`, mas:0, menos:u.tt, id:u.id}));
  }
  ev.sort((x,y)=>x.f<y.f?-1:x.f>y.f?1:(x.tipo==="res"?-1:1));
  let s=0; const filas=ev.map(e=>{ s+=e.mas-e.menos;
    return `<tr class="${e.tipo==="uso"?"fdUso":"fdRes"}" ${e.id?`onclick="abrirVista(${e.id})"`:""}>
      <td>${e.f}</td><td><b>${e.txt}</b><br><small class="g">${e.det}</small></td>
      <td class="num">${e.mas?fmt(e.mas):""}</td><td class="num neg">${e.menos?fmt(e.menos):""}</td>
      <td class="num tot ${s<0?"neg":""}">${fmt(s)}</td></tr>`; }).join("");
  const RES=ev.reduce((a,e)=>a+e.mas,0), USO=ev.reduce((a,e)=>a+e.menos,0);
  const porSub=q(`SELECT COALESCE(sub,'—') k, SUM(${TOTAL}) t, COUNT(*) n FROM mov WHERE categ='FONDO RESERVA' GROUP BY k ORDER BY t DESC`);
  const ult=ev.filter(e=>e.tipo==="res").slice(-1)[0];
  $("#app").innerHTML=`
  <div class="barra rpBar">
    <span class="certTit">FONDO DE RESERVA · CUENTA CORRIENTE</span>
  </div>
  <div class="rpWrap"><div class="rpBox">
   ${cabPrint("FONDO DE RESERVA · CUENTA CORRIENTE","al "+hoy)}
   ${tarj([["RESERVADO ACUMULADO",RES],["UTILIZADO",USO],["SALDO DEL FONDO",RES-USO,RES-USO<0?"neg":"tt"]])}
   ${RES-USO<0?`<div class="proyAlerta">⚠ El fondo está sobregirado: se usó más de lo que se reservó.
     Conviene revisar los porcentajes de previsión del certificado.</div>`:""}
   ${ult?`<div class="rpNota">La última previsión, la de ${MESES[ult.r.mes-1][0]+MESES[ult.r.mes-1].slice(1).toLowerCase()},
     aportó ${fmt(ult.mas)} al fondo.</div>`:""}
   <table class="coTab rpTab2 fdTab">
    <thead><tr><th>FECHA</th><th>CONCEPTO</th><th class="num">SE RESERVA</th><th class="num">SE UTILIZA</th><th class="num">SALDO DEL FONDO</th></tr></thead>
    <tbody>${filas||`<tr><td colspan="5" class="g">Todavía no hay movimientos en el fondo.</td></tr>`}
     <tr class="coTot"><td colspan="2">TOTALES</td><td class="num">${fmt(RES)}</td>
      <td class="num">${fmt(USO)}</td><td class="num">${fmt(RES-USO)}</td></tr>
    </tbody></table>
   ${porSub.length?`<div class="rpNota" style="margin-top:12px">En qué se usó el fondo:</div>
    <table class="coTab rpTab2 fdTab"><thead><tr><th>CONCEPTO</th><th class="num">CASOS</th><th class="num">IMPORTE</th><th class="num">% de lo usado</th></tr></thead>
     <tbody>${porSub.map(x=>`<tr><td><b>${x.k}</b></td><td class="num g">${x.n}</td>
       <td class="num tot">${fmt(x.t)}</td><td class="num g">${USO?(x.t/USO*100).toFixed(1):0}%</td></tr>`).join("")}</tbody></table>`:""}
   <div class="rpNota">Los pagos contra el fondo <b>no vuelven a contar como gasto del mes</b>: ya se cargaron

   </div>
   ${ev.slice().reverse().map(e=>`<div class="lgCard" ${e.id?`onclick="abrirVista(${e.id})"`:""}>
     <div class="liqML"><b>${e.txt}</b><b class="${e.menos?"neg":""}">${fmt(e.mas||e.menos)}</b></div>
     <div class="liqML"><span>${e.f}</span><span>${e.tipo==="uso"?"se utiliza":"se reserva"}</span></div>
   </div>`).join("")}
  </div>`;
}

/* ==================== CERTIFICADO DEL MES ====================
   Arranca del gasto por obra a valores NETOS (el IVA no es costo: se recupera).
   Le suma lo que sí queda hundido —las percepciones sufridas, de difícil recupero—
   y las previsiones, y de ahí sale el costo real del mes, el margen y el resultado. */
const CERTD={cert_desp:"3",cert_amort:"10",cert_o1t:"Garantías y reparaciones",cert_o1p:"1",
             cert_o2t:"Gastos financieros",cert_o2p:"0.5",cert_marg:"18",cert_gan:"35"};
const cfgD=(k)=>{ const v=cfg(k); return v===""?CERTD[k]:v; };
const cfgDN=(k)=>{ const v=parseFloat(String(cfgD(k)).replace(",",".")); return isNaN(v)?0:v; };
function certSet(k,v){ setCfg(k,v); renderCert(); }
function renderCert(){
  if(!RPTMES){ RPTMES=+hoy.slice(5,7); RPTANIO=+hoy.slice(0,4); }
  const anios=q("SELECT DISTINCT substr(pago,1,4) a FROM mov ORDER BY 1").map(x=>+x.a);
  if(!anios.includes(RPTANIO)) RPTANIO=anios[anios.length-1];
  const [D,H]=rangoMes(), pr=[D,H];
  const W=`${GASTO} AND pago BETWEEN ? AND ?`;
  /* --- gasto por obra, a neto --- */
  const filas=q(`SELECT COALESCE(categ,'—') k, COALESCE(obra,'— sin obra —') o, SUM(neto) t
    FROM mov WHERE ${W} GROUP BY k,o`,pr);
  const obras=[...new Set(filas.map(x=>x.o))].sort();
  const keys=[...new Set(filas.map(x=>x.k))];
  const val=(k,o)=>{ const x=filas.find(f=>f.k===k&&f.o===o); return x?x.t:0; };
  const totK=k=>filas.filter(f=>f.k===k).reduce((a,f)=>a+f.t,0);
  const totO=o=>filas.filter(f=>f.o===o).reduce((a,f)=>a+f.t,0);
  keys.sort((a,b)=>totK(b)-totK(a));
  const GASTOS=filas.reduce((a,f)=>a+f.t,0);
  const MO=totK("Mano Obra"), EQ=totK("Equipos");
  /* --- percepciones sufridas: quedan hundidas --- */
  const p=q(`SELECT COALESCE(SUM(CASE WHEN iibb>0 THEN iibb END),0) pb,
    COALESCE(SUM(CASE WHEN ivarp>0 THEN ivarp END),0) pi,
    COALESCE(SUM(CASE WHEN gcia>0 THEN gcia END),0) pg FROM mov WHERE ${W}`,pr)[0];
  const PERC=p.pb+p.pi+p.pg;
  /* --- previsiones --- */
  const pDesp=MO*cfgDN("cert_desp")/100;
  const pO1=GASTOS*cfgDN("cert_o1p")/100, pO2=GASTOS*cfgDN("cert_o2p")/100;
  const pAmo=EQ*cfgDN("cert_amort")/100;   /* amortización sobre los equipos usados en el mes */
  const COSTO=GASTOS+PERC+pDesp+pO1+pO2+pAmo;
  const MARG=COSTO*cfgDN("cert_marg")/100;
  const CERTIF=COSTO+MARG;
  const IMPG=MARG*cfgDN("cert_gan")/100;
  const NETO=MARG-IMPG;
  const pct=v=>GASTOS?(v/GASTOS*100).toFixed(1)+"%":"—";
  const inpT=(k,w)=>`<input class="certT" style="width:${w}" value="${cfgD(k)}" onchange="certSet('${k}',this.value)">`;
  const inpP=k=>`<span class="cfG certP"><input type="number" step="0.01" value="${cfgD(k)}" onchange="certSet('${k}',this.value)"><b>%</b></span>`;
  /* la tabla es una sola: las líneas de costo reusan las columnas de la matriz con colspan.
     Así el importe siempre cae bajo TOTAL y el porcentaje bajo %, sea cual sea el ancho. */
  const cR=Math.max(1,obras.length-1), cB=Math.max(1,obras.length-cR);
  const li=(rot,base,pc,imp,cls,iva)=>`<tr class="${cls||""}">
    <td class="certRot" colspan="${cR}">${rot}</td>
    <td class="num g" colspan="${cB}">${base===null?"":(typeof base==="number"?fmt(base):base)}</td>
    <td class="certPc">${pc||""}</td>
    <td class="num tot">${fmt(imp)}</td>
    <td class="num g">${iva?`<em class="certIva">+ IVA</em>`:pct(imp)}</td></tr>`;
  $("#app").innerHTML=`
  <div class="barra rpBar">
    <span class="certTit">CERTIFICADO DEL MES</span>
    <div class="rpPer">
      <select onchange="RPTMES=+this.value;renderCert()">${MESES.map((m,i)=>`<option value="${i+1}" ${i+1===RPTMES?"selected":""}>${m[0]+m.slice(1).toLowerCase()}</option>`).join("")}</select>
      <select onchange="RPTANIO=+this.value;renderCert()">${anios.map(a=>`<option ${a===RPTANIO?"selected":""}>${a}</option>`).join("")}</select>
    </div>
  </div>
  <div class="rpWrap"><div class="rpBox">
   ${cabPrint("CERTIFICADO DEL MES",perMes())}
   <table class="coTab rpTab2 certTab">
    <colgroup><col style="width:22ch">${obras.map(()=>`<col style="width:14ch">`).join("")}<col style="width:16ch"><col style="width:8ch"></colgroup>
    <thead><tr><th>GASTOS POR OBRA · NETO SIN IVA</th>${obras.map(o=>`<th class="num">${o}</th>`).join("")}<th class="num">TOTAL</th><th class="num">%</th></tr></thead>
    <tbody>${keys.map(k=>`<tr><td><b>${k}</b></td>
      ${obras.map(o=>{const v=val(k,o); return `<td class="num ${v?"":"g"}">${v?fmt(v):"·"}</td>`}).join("")}
      <td class="num tot">${fmt(totK(k))}</td><td class="num g">${pct(totK(k))}</td></tr>`).join("")}
     <tr class="coTot"><td>TOTAL GASTOS SIN IVA</td>${obras.map(o=>`<td class="num">${fmt(totO(o))}</td>`).join("")}
      <td class="num">${fmt(GASTOS)}</td><td class="num">100%</td></tr>

     <tr class="certSep"><td colspan="${cR}">SE SUMAN AL COSTO</td><td colspan="${cB}" class="num">BASE DE CÁLCULO</td>
      <td class="certPc">%</td><td class="num">IMPORTE</td><td class="num">s/gastos</td></tr>
     ${li("Percepciones de INGRESOS BRUTOS",null,"",p.pb)}
     ${li("Percepciones de IVA",null,"",p.pi)}
     ${li("Percepciones de GANANCIAS",null,"",p.pg)}
     ${li("Previsión por despidos",MO,inpP("cert_desp"),pDesp)}
     ${li(`Otras previsiones s/total · ${inpT("cert_o1t","100%")}`,GASTOS,inpP("cert_o1p"),pO1)}
     ${li(`Otras previsiones s/total · ${inpT("cert_o2t","100%")}`,GASTOS,inpP("cert_o2p"),pO2)}
     ${li("Amortizaciones s/equipos utilizados",EQ,inpP("cert_amort"),pAmo)}
     ${li("A FONDO DE RESERVA","se aparta, no se gasta","",pDesp+pO1+pO2+pAmo,"certFondo")}
     ${li("COSTO TOTAL DEL MES",GASTOS,`+${fmt(COSTO-GASTOS)}`,COSTO,"coTot")}
     ${li("Margen sobre el costo",COSTO,inpP("cert_marg"),MARG,"certMarg")}
     ${li("TOTAL A CERTIFICAR","costo + margen","",CERTIF,"certCert",true)}
     ${li("RESULTADO ANTES DE IMPUESTOS","","",MARG,"certRes")}
     ${li("Impuesto a las ganancias",MARG,inpP("cert_gan"),-IMPG)}
     ${li("RESULTADO NETO DESPUÉS DE IMPTOS","","",NETO,"certFin")}
    </tbody></table>
   <div class="rpNota">Los importes de arriba son <b>netos</b>: el IVA no es costo porque se recupera contra el débito.
     Las percepciones sufridas sí se toman como costo hundido, por su dificultad de recupero.
     Las previsiones se calculan sobre el gasto del mes, no en cascada: ninguna se aplica sobre otra.</div>
  </div></div>
  <div class="cards certCards">
   <div class="rmSel">
     <div class="rmTitMob">CERTIFICADO DEL MES</div>
     <div class="rmPer">
       <select onchange="RPTMES=+this.value;renderCert()">${MESES.map((m,i)=>`<option value="${i+1}" ${i+1===RPTMES?"selected":""}>${m[0]+m.slice(1).toLowerCase()}</option>`).join("")}</select>
       <select onchange="RPTANIO=+this.value;renderCert()">${anios.map(a=>`<option ${a===RPTANIO?"selected":""}>${a}</option>`).join("")}</select>
     </div>
   </div>
   <div class="rmTot"><small>TOTAL A CERTIFICAR</small><b>${fmt(CERTIF)}</b><span>+ IVA · resultado neto ${fmt(NETO)}</span></div>
   ${obras.map(o=>`<div class="lgCard"><div class="liqML"><b>${o}</b><b>${fmt(totO(o))}</b></div></div>`).join("")}
   <div class="lgCard"><div class="liqML fin"><span>TOTAL GASTOS SIN IVA</span><b>${fmt(GASTOS)}</b></div></div>
   <div class="lgCard">
     <div class="liqML"><span>Percepciones IIBB</span><b>${fmt(p.pb)}</b></div>
     <div class="liqML"><span>Percepciones IVA</span><b>${fmt(p.pi)}</b></div>
     <div class="liqML"><span>Percepciones Ganancias</span><b>${fmt(p.pg)}</b></div>
     <div class="liqML"><span>Previsión despidos ${cfgD("cert_desp")}%</span><b>${fmt(pDesp)}</b></div>
     <div class="liqML"><span>${cfgD("cert_o1t")} ${cfgD("cert_o1p")}%</span><b>${fmt(pO1)}</b></div>
     <div class="liqML"><span>${cfgD("cert_o2t")} ${cfgD("cert_o2p")}%</span><b>${fmt(pO2)}</b></div>
     <div class="liqML"><span>Amortizaciones ${cfgD("cert_amort")}% s/equipos</span><b>${fmt(pAmo)}</b></div>
     <div class="liqML fin"><span>COSTO TOTAL DEL MES</span><b>${fmt(COSTO)}</b></div>
   </div>
   <div class="lgCard">
     <div class="liqML"><span>Margen ${cfgD("cert_marg")}%</span><b>${fmt(MARG)}</b></div>
     <div class="liqML fin"><span>TOTAL A CERTIFICAR</span><b>${fmt(CERTIF)} <em class="certIva">+ IVA</em></b></div>
     <div class="liqML"><span>Impuesto a las ganancias ${cfgD("cert_gan")}%</span><b class="neg">${fmt(IMPG)}</b></div>
     <div class="liqML fin"><span>RESULTADO NETO DESPUÉS DE IMPTOS</span><b>${fmt(NETO)}</b></div>
   </div>
   <div class="rmPie">Los porcentajes se editan desde la computadora.</div>
  </div>`;
}

/* ==================== MANO DE OBRA ====================
   Los recibos los liquida el contador en ARCA. Acá se hacen tres cosas:
   1) se le pasa el cierre de horas, 2) se carga lo que él determinó y se paga,
   3) se imputa todo a las obras usando las horas que ya están cargadas.
   Los porcentajes de CONFIG no generan asientos: sirven para controlar al contador. */
function rangoQna(){
  const m=cfgN("mes",7), a=cfgN("anio",2026), qn=cfgN("qna",2);
  const fin=new Date(a,m,0).getDate(), p=n=>String(n).padStart(2,"0");
  return qn==1?[`${a}-${p(m)}-01`,`${a}-${p(m)}-15`]:[`${a}-${p(m)}-16`,`${a}-${p(m)}-${fin}`];
}
const qnaId = () => `${cfg("anio")}-${String(cfgN("mes",7)).padStart(2,"0")}-${cfg("qna")}`;
const qnaTxt = () => { const [d,h]=rangoQna();
  return `${d.slice(8)}/${d.slice(5,7)} al ${h.slice(8)}/${h.slice(5,7)}/${h.slice(2,4)}`; };

/* horas de la quincena, con el reparto por obra de cada operario */
function horasQna(){
  const [D,H]=rangoQna();
  const R=q(`SELECT p.legajo, o.nombre, o.categoria, o.afiliado, o.ingreso,
     COALESCE(SUM(p.hsn),0) hsn, COALESCE(SUM(p.hs50),0) h50, COALESCE(SUM(p.hs100),0) h100,
     COUNT(DISTINCT p.fecha) dias
     FROM parte p JOIN operario o USING(legajo) WHERE p.fecha BETWEEN ? AND ?
     GROUP BY p.legajo ORDER BY o.nombre`,[D,H]);
  const rep=q(`SELECT legajo, obra, SUM(hsn+hs50*1.5+hs100*2) eq FROM parte
     WHERE fecha BETWEEN ? AND ? AND obra IS NOT NULL GROUP BY legajo,obra HAVING eq>0`,[D,H]);
  const pg=q("SELECT * FROM liqpago WHERE per=?",[qnaId()]);
  return R.map(r=>{
    const mios=rep.filter(x=>x.legajo===r.legajo), tot=mios.reduce((a,x)=>a+x.eq,0);
    const p=pg.find(x=>x.legajo===r.legajo)||{};
    const e=q("SELECT vh FROM escala WHERE categoria=?",[r.categoria]);
    const vh=e.length?e[0].vh:0;
    const bruto=r.hsn*vh + r.h50*vh*1.5 + r.h100*vh*2;
    const desc=bruto*(cfgN("jub")+cfgN("pami")+cfgN("os")+(r.afiliado==="SI"?cfgN("sind"):cfgN("solid")))/100;
    return {...r, eqTot:tot, obras:mios.map(x=>({obra:x.obra, part:tot?x.eq/tot:0})),
            estim:bruto-desc, neto:p.neto??null, premio:p.premio??null};
  });
}
const sumH=(L,k)=>L.reduce((a,x)=>a+(x[k]||0),0);
function cabMO(){
  const [D,H]=rangoQna();
  return `<div class="barra rpBar">

function csvHoras(){

/* ---------- 2 · PAGO DE LA QUINCENA ---------- */
function pagoSet(l,campo,v){
  const n=parseFloat(String(v).replace(/\./g,"").replace(",","."))||0;
  const per=qnaId();
  if(!q("SELECT 1 x FROM liqpago WHERE per=? AND legajo=?",[per,l]).length)
    DB.run("INSERT INTO liqpago(per,legajo,neto,premio) VALUES(?,?,0,0)",[per,l]);
  DB.run(`UPDATE liqpago SET ${campo}=? WHERE per=? AND legajo=?`,[n,per,l]);
  renderConFoco(renderPago);
}
function repartoQna(){
  const L=horasQna(), obras={};
  for(const x of L){
    const monto=(x.neto||0)+(x.premio||0);
    if(!monto||!x.obras.length) continue;
    for(const o of x.obras){
      obras[o.obra]=obras[o.obra]||{neto:0,premio:0};
      obras[o.obra].neto+=(x.neto||0)*o.part;
      obras[o.obra].premio+=(x.premio||0)*o.part;
    }
  }
  return obras;
}
function renderPago(){
  const L=horasQna(), rep=repartoQna();
  const tN=sumH(L,"neto"), tP=sumH(L,"premio"), tE=sumH(L,"estim");
  const sinCargar=L.filter(x=>x.neto===null).length;
  const ya=q("SELECT COUNT(*) n FROM mov WHERE cbte=?",["LIQ-"+qnaId()])[0].n;
  $("#app").innerHTML = cabMO() + `<div class="rpWrap"><div class="rpBox">
   ${cabPrint("PAGO DE LA QUINCENA",qnaTxt())}
   ${tarj([["NUESTRO CÁLCULO",tE],["NETO S/CONTADOR",tN],["DIFERENCIA",tN-tE,Math.abs(tN-tE)>tE*0.02?"neg":""],
           ["PREMIOS Y AJUSTES",tP],["TOTAL A PAGAR",tN+tP,"tt"]])}
   ${ya?`<div class="proyAlerta">Esta quincena ya tiene ${ya} asiento${ya===1?"":"s"} generado${ya===1?"":"s"}.
     Si volvés a generar, se van a duplicar.</div>`:""}
   ${sinCargar?`<div class="rpNota">Faltan cargar ${sinCargar} netos de los ${L.length} operarios.</div>`:""}
   ${L.length?tb([["LEGAJO","num"],["OPERARIO"],["HS N","num"],["HS 50","num"],["HS 100","num"],
     ["NUESTRO CÁLCULO","num"],["NETO S/CONTADOR","num"],["DIFER.","num"],["PREMIOS","num"],["A PAGAR","num"],["OBRAS"]],
     L.map(x=>{ const d=(x.neto||0)-x.estim, al=x.neto!==null&&Math.abs(d)>x.estim*0.05;
       return `<tr class="${al?"cNo":""}">
       <td class="num g">${x.legajo}</td><td><b>${x.nombre}</b></td>
       <td class="num g">${fmt(x.hsn)}</td><td class="num g">${x.h50?fmt(x.h50):""}</td>
       <td class="num g">${x.h100?fmt(x.h100):""}</td>
       <td class="num g">${fmt(x.estim)}</td>
       <td class="num"><input class="pgIn" inputmode="numeric" value="${x.neto!==null?fmt(x.neto):""}"
          placeholder="—" onchange="pagoSet(${x.legajo},'neto',this.value)"></td>
       <td class="num ${d<0?"neg":""}">${x.neto!==null?fmt(d):""}</td>
       <td class="num"><input class="pgIn" inputmode="numeric" value="${x.premio?fmt(x.premio):""}"
          placeholder="—" onchange="pagoSet(${x.legajo},'premio',this.value)"></td>
       <td class="num tot">${fmt((x.neto||0)+(x.premio||0))}</td>
       <td class="g">${x.obras.map(o=>`${o.obra} ${(o.part*100).toFixed(0)}%`).join(" · ")||"—"}</td></tr>`;}).join(""),
     `<td colspan="5">TOTAL · ${L.length} operarios</td><td class="num">${fmt(tE)}</td>
      <td class="num">${fmt(tN)}</td><td class="num">${fmt(tN-tE)}</td><td class="num">${fmt(tP)}</td>
      <td class="num">${fmt(tN+tP)}</td><td></td>`)
     :`<div class="rpNota">Sin jornadas en la quincena.</div>`}
   <div class="rpNota">La columna <b>NUESTRO CÁLCULO</b> sale de la escala y los porcentajes de CONFIG:
     es sólo para contrastar con lo que determinó el contador. Se marcan en rojo las diferencias mayores al 5%.
     El reparto por obra usa las horas de cada operario, no un promedio.</div>

   ${Object.keys(rep).length?`<div class="proyBox">
     <div class="proyTit">CÓMO SE IMPUTA A CADA OBRA</div>
     ${tb([["OBRA"],["JORNALES · s/contador","num"],["PREMIOS · otra caja","num"],["TOTAL","num"],["%","num"]],
       Object.keys(rep).sort().map(o=>`<tr><td><b>${o}</b></td>
         <td class="num">${fmt(rep[o].neto)}</td><td class="num">${fmt(rep[o].premio)}</td>
         <td class="num tot">${fmt(rep[o].neto+rep[o].premio)}</td>
         <td class="num g">${(tN+tP)?((rep[o].neto+rep[o].premio)/(tN+tP)*100).toFixed(1):0}%</td></tr>`).join(""),

       comprobante RECIBO, y los premios de <b>${cfg("ctaCaja")}</b> con comprobante FAC X, porque no los liquida el contador.</div>
   </div>`:""}

function generarPago(){
  const rep=repartoQna(), per=qnaId(), fec=$("#pg_fec").value||hoy;
  const obras=Object.keys(rep).sort();
  if(!obras.length) return;
  const n=obras.filter(o=>rep[o].neto>0).length+obras.filter(o=>rep[o].premio>0).length;
  if(!confirm(`Se generan ${n} asientos por la quincena ${qnaTxt()}.`)) return;
  const ia=DB.prepare("INSERT INTO audit(ts,usuario,accion,mov_id,campo,antes,despues) VALUES(?,?,?,?,?,?,?)");
  const alta=(cta,tc,sub,obra,con,imp)=>{
    DB.run(`INSERT INTO mov(cuenta,tipo,cbte,tcbte,emis,pago,concepto,neto,categ,sub,obra,etapa)
      VALUES(?,?,?,?,?,?,?,?,'Mano Obra',?,?,?)`,
      [cta,"TRANSFER","LIQ-"+per,tc,fec,fec,con,Math.round(imp),sub,obra,cfg("etapaDef")||null]);
    const id=q("SELECT MAX(id) m FROM mov")[0].m;
    ia.run([ahora(),USUARIO,"ALTA AUTOM.",id,"pago quincena",`${per} · ${obra}`,String(Math.round(imp))]);
  };
  for(const o of obras){
    if(rep[o].neto>0) alta(cfg("ctaBco"),"RECIBO",cfg("subRbo"),o,`Jornales quincena ${qnaTxt()} · ${o}`,rep[o].neto);
    if(rep[o].premio>0) alta(cfg("ctaCaja"),"FAC X",cfg("subAdic"),o,`Premios quincena ${qnaTxt()} · ${o}`,rep[o].premio);
  }
  ia.free();
  $("#pg_msg").innerHTML=`<b style="color:#375623">Listo: ${n} asientos cargados con fecha ${fec}.</b>`;
}

/* ---------- 3 · APORTES M.O. ---------- */

  const dist={}; Object.keys(rep).forEach(o=>dist[o]=base?ap.monto*rep[o].neto/base:0);
  const ya=q("SELECT COUNT(*) n FROM mov WHERE cbte=?",["APO-"+per])[0].n;
  const CTAS=window.DATOS.maestros.cuentas.filter(c=>!["DESACOPIO","SOBREPRECIO"].includes(c));

           ["DIFERENCIA",ap.monto-nuestro,Math.abs(ap.monto-nuestro)>nuestro*0.05?"neg":""],
           ["BASE DE REPARTO · jornales",base]])}
   ${ya?`<div class="proyAlerta">Esta quincena ya tiene ${ya} asiento${ya===1?"":"s"} de aportes generado${ya===1?"":"s"}.</div>`:""}
   <div class="apCarga">
     <label>TOTAL DEPOSITADO<input id="ap_m" class="numIn" inputmode="numeric" value="${fmt(ap.monto)}"
       oninput="sepMil(this)" onchange="apSet()"></label>
     <label>CUENTA<select id="ap_c" onchange="apSet()">${CTAS.map(c=>`<option ${c===ap.cuenta?"selected":""}>${c}</option>`).join("")}</select></label>
     <label>FECHA<input type="date" id="ap_f" value="${ap.fecha||cfg("fpago")}" onchange="apSet()"></label>
   </div>
   ${ap.monto&&base?tb([["OBRA"],["JORNALES DE LA OBRA","num"],["%","num"],["APORTES A IMPUTAR","num"]],
     Object.keys(rep).sort().map(o=>`<tr><td><b>${o}</b></td><td class="num g">${fmt(rep[o].neto)}</td>
       <td class="num g">${(rep[o].neto/base*100).toFixed(1)}%</td>
       <td class="num tot">${fmt(dist[o])}</td></tr>`).join(""),
     `<td>TOTAL</td><td class="num">${fmt(base)}</td><td class="num">100%</td><td class="num">${fmt(ap.monto)}</td>`)

     horas: el monto de cada operario ya lleva adentro su categoría, así que la mezcla de oficiales
     y ayudantes de cada obra queda reflejada.</div>
  </div></div>`;
}
function apSet(){
  const per=qnaId(), m=parseFloat(($("#ap_m").value||"0").replace(/\./g,""))||0;
  const c=$("#ap_c").value, f=$("#ap_f").value;
  if(!q("SELECT 1 x FROM liqap WHERE per=?",[per]).length) DB.run("INSERT INTO liqap(per,monto,cuenta,fecha) VALUES(?,0,?,?)",[per,c,f]);
  DB.run("UPDATE liqap SET monto=?, cuenta=?, fecha=? WHERE per=?",[m,c,f,per]);
  renderConFoco(renderAportes);
}
function generarAportes(){
  const per=qnaId(), rep=repartoQna();
  const ap=q("SELECT * FROM liqap WHERE per=?",[per])[0];
  if(!ap||!ap.monto) return;
  const base=Object.keys(rep).reduce((a,o)=>a+rep[o].neto,0);
  if(!base) return;
  const obras=Object.keys(rep).sort();
  if(!confirm(`Se generan ${obras.length} asientos de aportes por ${fmt(ap.monto)}.`)) return;
  const ia=DB.prepare("INSERT INTO audit(ts,usuario,accion,mov_id,campo,antes,despues) VALUES(?,?,?,?,?,?,?)");
  for(const o of obras){
    const imp=Math.round(ap.monto*rep[o].neto/base);
    if(imp<=0) continue;
    DB.run(`INSERT INTO mov(cuenta,tipo,cbte,tcbte,emis,pago,concepto,neto,categ,sub,obra,etapa)
      VALUES(?,'TRANSFER',?,'VEP',?,?,?,?,'Mano Obra','Cargas Sociales',?,?)`,
      [ap.cuenta,"APO-"+per,ap.fecha,ap.fecha,`Aportes M.O. quincena ${qnaTxt()} · ${o}`,imp,o,cfg("etapaDef")||null]);
    const id=q("SELECT MAX(id) m FROM mov")[0].m;
    ia.run([ahora(),USUARIO,"ALTA AUTOM.",id,"aportes quincena",`${per} · ${o}`,String(imp)]);
  }
  ia.free();
  $("#ap_msg").innerHTML=`<b style="color:#375623">Listo: ${obras.length} asientos de aportes cargados.</b>`;
}

/* ==================== REPORTES FINANCIEROS ====================
   Siete vistas sobre la misma base. Todas mensuales salvo ACOPIOS, que es una foto de stock. */
const FIN = {
  ext  :{tit:"$ EXTRACTOS",            sol:"EXTRACTOS"},
  flujo:{tit:"$ FLUJO DE FONDOS",      sol:"FLUJO"},
  imp  :{tit:"$ IMPUESTOS",            sol:"IMPUESTOS"},
  iva  :{tit:"$ IVA · POSICIONES",     sol:"IVA"},
  iibb :{tit:"$ INGRESOS BRUTOS",      sol:"IIBB"},
  gcia :{tit:"$ GANANCIAS",            sol:"GANANCIAS"},
  ret  :{tit:"$ RETENCIONES",         sol:"RETENCIONES"},
  acop :{tit:"$ ACOPIOS / DESACOPIOS", sol:"ACOPIOS"},
  conc :{tit:"$ CONCILIACIÓN BANCARIA",sol:"CONCILIACIÓN"}
};
let FINTIPO="ext", FINCTA="", FINTOL=1000, FINDIAS=5, FINBCO="", FINPROY="";
function verFin(t){ FINTIPO=t; nav("fin"); }
function saldoAl(c,f){
  const r=q(`SELECT
    COALESCE(SUM(CASE WHEN categ='VENTAS' AND cuenta=? THEN ${TOTAL} END),0) ven,
    COALESCE(SUM(CASE WHEN tcbte='M.INT.' AND ctadest=? THEN ${TOTAL} END),0) ent,
    COALESCE(SUM(CASE WHEN tcbte='M.INT.' AND cuenta=? THEN ${TOTAL} END),0) sal,
    COALESCE(SUM(CASE WHEN categ<>'VENTAS' AND (tcbte IS NULL OR tcbte<>'M.INT.') AND cuenta=? THEN ${TOTAL} END),0) gas,
    COALESCE(SUM(CASE WHEN categ='ACOPIO' AND COALESCE(cuenta,'') NOT IN ('DESACOPIO','SOBREPRECIO') THEN neto END),0) acop
    FROM mov WHERE pago<=?`,[c,c,c,c,f])[0];
  const ini=(q("SELECT monto m FROM saldo_ini WHERE cuenta=?",[c])[0]||{m:0}).m;
  return ini + r.ven + r.ent - r.sal - r.gas + (c==="DESACOPIO"?r.acop:0);
}
const diaAnterior = f => { const d=new Date(f+"T00:00:00"); d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10); };
function renderFin(){

  if(!FINBCO) FINBCO=CTAS.find(c=>c.startsWith("BANCO"))||CTAS[0];

   </div>`;

    iibb:(d,hh)=>finImpuesto("iibb",d,hh), gcia:(d,hh)=>finImpuesto("gcia",d,hh)}[FINTIPO](D,H,M);
  $("#app").innerHTML=`
  <div class="barra rpBar">

  </div>
  <div class="rpWrap"><div class="rpBox">${cabPrint(F.tit,FINTIPO==="ext"?FINCTA+" · "+perMes():perMes())}${per}${cuerpo}</div></div>
  ${modalAlta(M)}`;

const tarj = arr => `<div class="finRes">${arr.map(([r,v,cl])=>`<div><small>${r}</small><b class="${cl||""}">${fmt(v)}</b></div>`).join("")}</div>`;
const tb = (cols,filas,tot) => `<table class="coTab rpTab2"><thead><tr>${cols.map(c=>`<th class="${c[1]||""}">${c[0]}</th>`).join("")}</tr></thead>
  <tbody>${filas}${tot?`<tr class="coTot">${tot}</tr>`:""}</tbody></table>`;

/* ---------- EXTRACTO DE UNA CUENTA ---------- */
function finExt(D,H){
  const ini=saldoAl(FINCTA,diaAnterior(D));
  const mv=q(`SELECT *, ${TOTAL} tt FROM mov WHERE pago BETWEEN ? AND ? AND (cuenta=? OR ctadest=?) ORDER BY pago, id`,[D,H,FINCTA,FINCTA]);
  let s=ini, ent=0, sal=0, filas="";
  for(const r of mv){
    const esEnt = (r.categ==="VENTAS" && r.cuenta===FINCTA) || (r.tcbte==="M.INT." && r.ctadest===FINCTA);
    const esSal = (r.tcbte==="M.INT." && r.cuenta===FINCTA) || (r.categ!=="VENTAS" && r.tcbte!=="M.INT." && r.cuenta===FINCTA);
    if(!esEnt && !esSal) continue;
    if(esEnt) ent+=r.tt; else sal+=r.tt;
    s += esEnt ? r.tt : -r.tt;
    filas+=`<tr onclick="abrirVista(${r.id})"><td class="num g">${r.id}</td><td>${r.pago.slice(5)}</td>
      <td>${r.tcbte||""}</td><td>${r.concepto||""}</td><td>${r.prov||r.ctadest||""}</td>
      <td class="num">${esEnt?fmt(r.tt):""}</td><td class="num neg">${esSal?fmt(r.tt):""}</td>
      <td class="num tot">${fmt(s)}</td></tr>`;
  }
  return tarj([["SALDO INICIAL",ini],["ENTRADAS",ent],["SALIDAS",sal],["SALDO AL CIERRE",s,"tt"]])
   + tb([["N°","num"],["PAGO"],["CBTE"],["CONCEPTO"],["PROVEEDOR / DESTINO"],["ENTRADAS","num"],["SALIDAS","num"],["SALDO","num"]],
        filas||`<tr><td colspan="8" class="g">Sin movimientos en el mes.</td></tr>`)
   + `<div class="rpNota">Saldo corrido de <b>${FINCTA}</b>. El saldo inicial es el arrastre al ${diaAnterior(D)}.</div>`;
}

/* ---------- PROYECCIÓN DE SALDOS DE BANCO ----------
   Sólo cuentas bancarias: son las únicas con compromisos a futuro. */
const COLB=["#1F4E79","#2F7D32","#B7791F","#7A5EA8"];
/* la alerta se adelanta 2 días hábiles: hay que tener la plata ANTES de que el cheque toque */
function menosHabiles(f,n){
  const d=new Date(f+"T00:00:00"); let c=0;
  while(c<n){ d.setDate(d.getDate()-1); const w=d.getDay(); if(w!==0&&w!==6) c++; }
  return d.toISOString().slice(0,10);
}
const fCorto=f=>{ const [y,m,d]=f.split("-"); return `${+d}-${m}/${y.slice(2)}`; };
function graficoFlujo(D,H,M){
  const BAN=M.cuentas.filter(c=>/^BANCO/i.test(c));
  if(!BAN.length) return "";
  const ult=q("SELECT MAX(pago) f FROM mov WHERE pago>?",[hoy])[0].f;
  const FIN=(ult&&ult>H)?ult:H;
  if(FIN<=D) return "";
  const dia=f=>Math.round((new Date(f+"T00:00:00")-new Date(D+"T00:00:00"))/86400000);
  const TOT=dia(FIN)||1;
  const S={}; BAN.forEach(c=>S[c]=saldoAl(c,diaAnterior(D)));
  const mv=q(`SELECT cuenta,ctadest,categ,tcbte,pago,${TOTAL} tt FROM mov WHERE pago BETWEEN ? AND ? ORDER BY pago`,[D,FIN]);
  const serie={}; BAN.forEach(c=>serie[c]=[{d:0,v:S[c]}]);
  let i=0;
  while(i<mv.length){
    const f=mv[i].pago;
    while(i<mv.length && mv[i].pago===f){
      const m=mv[i];
      if(m.categ==="VENTAS" && S[m.cuenta]!==undefined) S[m.cuenta]+=m.tt;
      else if(m.tcbte==="M.INT."){ if(S[m.cuenta]!==undefined) S[m.cuenta]-=m.tt;
                                   if(S[m.ctadest]!==undefined) S[m.ctadest]+=m.tt; }
      else if(S[m.cuenta]!==undefined) S[m.cuenta]-=m.tt;
      i++;
    }
    const d=dia(f); BAN.forEach(c=>serie[c].push({d,v:S[c]}));
  }
  BAN.forEach(c=>serie[c].push({d:TOT,v:S[c]}));
  const todos=BAN.flatMap(c=>serie[c].map(p=>p.v));
  let mn=Math.min(...todos,0), mx=Math.max(...todos);
  const pad=(mx-mn)*0.10||1; mn-=pad; mx+=pad;
  const W=1000,Hh=320, ml=86,mr=132,mt=18,mb=32;
  const px=d=>ml+(d/TOT)*(W-ml-mr);
  const py=v=>mt+(1-(v-mn)/(mx-mn))*(Hh-mt-mb);
  const linea=s=>s.map((p,k)=>`${k?"L":"M"}${px(p.d).toFixed(1)},${py(p.v).toFixed(1)}`).join(" ");
  const mm=v=>Math.abs(v)>=1e6?(v/1e6).toFixed(0)+" M":fmt(v);
  let grid="";
  for(let k=0;k<=4;k++){ const v=mn+(mx-mn)*k/4, y=py(v);
    grid+=`<line x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" class="gLin"/>
      <text x="${ml-10}" y="${y+4}" class="gTxtY">${mm(v)}</text>`; }
  if(mn<0) grid+=`<rect x="${ml}" y="${py(0)}" width="${W-mr-ml}" height="${Hh-mb-py(0)}" class="gRojo"/>
    <line x1="${ml}" y1="${py(0)}" x2="${W-mr}" y2="${py(0)}" class="gCero"/>`;
  let meses="";
  const d0=new Date(D+"T00:00:00"), dF=new Date(FIN+"T00:00:00");
  for(let y=d0.getFullYear(), m=d0.getMonth(); ; ){
    const f=new Date(y,m,1); if(f>dF) break;
    if(f>=d0){ const d=Math.round((f-d0)/86400000), x=px(d);
      meses+=`<line x1="${x}" y1="${mt}" x2="${x}" y2="${Hh-mb}" class="gMes"/>
        <text x="${x}" y="${Hh-mb+18}" class="gTxtX">${MESES[m].slice(0,3)}</text>`; }
    m++; if(m>11){ m=0; y++; }
  }
  const dHoy=dia(hoy);
  const hoyM=(dHoy>=0&&dHoy<=TOT)?`<line x1="${px(dHoy)}" y1="${mt}" x2="${px(dHoy)}" y2="${Hh-mb}" class="gHoy"/>
    <rect x="${px(dHoy)-15}" y="${mt-1}" width="30" height="15" class="gHoyBox"/>
    <text x="${px(dHoy)}" y="${mt+10}" class="gTxtHoy">HOY</text>`:"";
  /* para cada banco: cuándo se queda sin fondos y cuánto falta cubrir */
  const fechaDe=d=>{ const x=new Date(D+"T00:00:00"); x.setDate(x.getDate()+d); return x.toISOString().slice(0,10); };
  const alertas=[];
  BAN.forEach((c,k)=>{
    const s=serie[c], neg=s.find(p=>p.v<0);
    if(!neg) return;
    const falta=Math.abs(Math.min(...s.map(p=>p.v)));
    const fReal=fechaDe(neg.d), fAviso=menosHabiles(fReal,2);
    alertas.push({c,k,d:neg.d,v:neg.v,falta,fReal,fAviso,tarde:fAviso<hoy});
  });
  /* el nombre y el saldo van al final de cada línea: se leen sobre la curva, no en una lista */
  const fin=BAN.map((c,k)=>({c,k,x:px(serie[c][serie[c].length-1].d),y:py(serie[c][serie[c].length-1].v),
                             v:serie[c][serie[c].length-1].v}));
  fin.sort((a,b)=>a.y-b.y);
  for(let i=1;i<fin.length;i++) if(fin[i].y-fin[i-1].y<15) fin[i].y=fin[i-1].y+15;
  const lin=BAN.map((c,k)=>{ const s=serie[c], f=s[s.length-1];
    return `<path d="${linea(s)}" class="gL" style="stroke:${COLB[k%COLB.length]}"/>
      <circle cx="${px(f.d)}" cy="${py(f.v)}" r="4.5" style="fill:${COLB[k%COLB.length]}"/>`; }).join("")
    + fin.map(f=>`<text x="${f.x+12}" y="${f.y+5}" class="gFin ${f.v<0?"neg":""}" style="fill:${f.v<0?"#9B2C2C":COLB[f.k%COLB.length]}">${f.c}<tspan dx="10" class="gFinV">${mm(f.v)}</tspan></text>`).join("");
  const marcas=alertas.map((a,i)=>{
    const x=px(a.d), y=py(a.v);
    const anc=x>W-mr-230?"end":"start", dx=anc==="end"?-12:12;
    const ty=Math.max(mt+30+i*34, py(a.v)-26);
    return `<line x1="${x}" y1="${mt}" x2="${x}" y2="${Hh-mb}" class="gAlerta"/>
      <circle cx="${x}" cy="${y}" r="6" class="gAlertaPt"/>
      <text x="${x+dx}" y="${ty}" class="gAlertaTx" text-anchor="${anc}">AT. CUBRIR ${a.tarde?"YA":fCorto(a.fAviso)} · ${fmt(a.falta)}</text>
      <text x="${x+dx}" y="${ty+13}" class="gAlertaSub" text-anchor="${anc}">${a.c} · vence ${fCorto(a.fReal)}</text>`;
  }).join("");
  return `<div class="chartBox">
   <div class="chartTit">PROYECCIÓN DE SALDOS BANCARIOS
     <span>${D} al ${FIN} · ${q("SELECT COUNT(*) n FROM mov WHERE pago>?",[hoy])[0].n} compromisos futuros ya firmados</span></div>
   <svg viewBox="0 0 ${W} ${Hh}" class="chartSvg" preserveAspectRatio="xMidYMid meet">
     ${grid}${meses}${hoyM}${lin}${marcas}
   </svg>
   ${alertas.map(a=>`<div class="proyAlerta alertaFuerte">
     ⚠ <b>AT. CUBRIR ${a.tarde?"YA":fCorto(a.fAviso)} · ${fmt(a.falta)}</b> en ${a.c}.
     El descubierto empieza el ${fCorto(a.fReal)}; la fecha de aviso se adelanta 2 días hábiles para que la
     transferencia esté acreditada. Tocá la cuenta en la tabla de arriba para ver qué vencimiento lo provoca.
   </div>`).join("")}
  </div>`;
}

/* ---------- TORTA CON VOLUMEN ----------
   Cada gajo se dibuja como un sólido: pared exterior + las dos caras del corte que
   quedan a la vista al separarlo. Se pintan de atrás hacia adelante para que las
   porciones se tapen en el orden correcto. */
const COL3=[["#3182CE","#2B6CB0","#1A4971"],["#DD6B20","#C05621","#8C3D18"],["#38A169","#2F7D32","#1E5620"],
            ["#8B6BB8","#7A5EA8","#553C7B"],["#159795","#0E7C7B","#0A5857"],["#D69E2E","#B7791F","#8A5B12"],
            ["#C53030","#9B2C2C","#742020"],["#5A6B82","#4A5568","#2D3748"],["#A0AEC0","#8695A8","#647082"]];
/* los nombres largos se parten en dos renglones juntos: si van en una línea
   se meten en las porciones vecinas */
function dosLineas(t){
  const s=String(t).trim();
  if(s.length<=11 || !s.includes(" ")) return [s];
  const p=s.split(" ");
  let corte=1, dif=1e9;
  for(let i=1;i<p.length;i++){
    const a=p.slice(0,i).join(" ").length, b=p.slice(i).join(" ").length;
    if(Math.abs(a-b)<dif){ dif=Math.abs(a-b); corte=i; }
  }
  return [p.slice(0,corte).join(" "), p.slice(corte).join(" ")];
}
let TORTAN=0;
function graficoTorta(items,total,et,cmp,rk){
  if(!items.length||!total) return "";
  const U="t"+(++TORTAN)+"_";
  let d=items.filter(x=>x.v>0).slice(0,8);
  if(items.length>8){ const r=items.slice(8).reduce((a,x)=>a+x.v,0); if(r>0) d=[...d,{k:`otros (${items.length-8})`,v:r}]; }
  const W=cmp?620:900, cx=W/2, cy=cmp?140:178, rx=cmp?232:156, ry=cmp?125:86,
        prof=cmp?24:26, sep=cmp?9:9, gap=186, salto=48;
  const P=(a,ox,oy,dy)=>[cx+rx*Math.cos(a)+(ox||0), cy+ry*Math.sin(a)+(oy||0)+(dy||0)];
  const n1=(x,y)=>`${x.toFixed(1)},${y.toFixed(1)}`;
  let ang=-Math.PI/2;
  const gajos=d.map((x,i)=>{
    const p=x.v/total, a1=ang, a2=ang+p*Math.PI*2, am=(a1+a2)/2; ang=a2;
    return {...x,p,a1,a2,am,ox:Math.cos(am)*sep,oy:Math.sin(am)*sep*(ry/rx),col:COL3[i%COL3.length],i};
  });
  /* cuerpo del gajo: arco frontal + caras del corte visibles */
  const cuerpo=g=>{
    let s="";
    const arco=(t1,t2)=>{
      if(t2<=t1) return "";
      const [x1,y1]=P(t1,g.ox,g.oy), [x2,y2]=P(t2,g.ox,g.oy);
      const gr=(t2-t1)>Math.PI?1:0;
      return `<path d="M${n1(x1,y1)} A${rx},${ry} 0 ${gr},1 ${n1(x2,y2)} L${n1(x2,y2+prof)}
        A${rx},${ry} 0 ${gr},0 ${n1(x1,y1+prof)} Z" fill="url(#${U}w${g.i})"/>`;
    };
    s+=arco(Math.max(g.a1,0),Math.min(g.a2,Math.PI));
    s+=arco(Math.max(g.a1,2*Math.PI),Math.min(g.a2,3*Math.PI));
    const cara=a=>{
      const [x,y]=P(a,g.ox,g.oy), cX=cx+g.ox, cY=cy+g.oy;
      return `<path d="M${n1(cX,cY)} L${n1(x,y)} L${n1(x,y+prof)} L${n1(cX,cY+prof)} Z" fill="url(#${U}c${g.i})"/>`;
    };
    if(Math.cos(g.a1)<0) s+=cara(g.a1);
    if(Math.cos(g.a2)>0) s+=cara(g.a2);
    return s;
  };
  const tapa=g=>{
    const [x1,y1]=P(g.a1,g.ox,g.oy), [x2,y2]=P(g.a2,g.ox,g.oy);
    if(g.p>0.999) return `<ellipse cx="${cx+g.ox}" cy="${cy+g.oy}" rx="${rx}" ry="${ry}" fill="url(#${U}t${g.i})"/>`;
    return `<path d="M${n1(cx+g.ox,cy+g.oy)} L${n1(x1,y1)} A${rx},${ry} 0 ${g.p>0.5?1:0},1 ${n1(x2,y2)} Z" fill="url(#${U}t${g.i})"/>`;
  };
  const defs=gajos.map(g=>`
    <linearGradient id="${U}t${g.i}" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="${g.col[0]}"/><stop offset="1" stop-color="${g.col[1]}"/></linearGradient>
    <linearGradient id="${U}w${g.i}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${g.col[1]}"/><stop offset="1" stop-color="${g.col[2]}"/></linearGradient>
    <linearGradient id="${U}c${g.i}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="${g.col[2]}"/><stop offset="1" stop-color="${g.col[1]}"/></linearGradient>`).join("");
  /* etiquetas repartidas y separadas */
  const der=gajos.filter(g=>Math.cos(g.am)>=0), izq=gajos.filter(g=>Math.cos(g.am)<0);
  const acomodar=(arr,lado)=>{
    if(!arr.length) return "";
    const L=arr.map(g=>{ const [x,y]=P(g.am*1,g.ox,g.oy); return {g,x:cx+rx*1.0*Math.cos(g.am)+g.ox,
      y:cy+ry*1.0*Math.sin(g.am)+g.oy+prof*0.35, ty:0}; });
    L.forEach(l=>l.ty=l.y); L.sort((a,b)=>a.y-b.y);
    for(let i=1;i<L.length;i++) if(L[i].ty-L[i-1].ty<salto) L[i].ty=L[i-1].ty+salto;
    const desp=(cy+prof/2)-((L[0].ty+L[L.length-1].ty)/2);
    L.forEach(l=>l.ty+=desp);
    return L.map(l=>{
      const xf=lado>0?W-gap:gap, xc=lado>0?l.x+(cmp?18:28):l.x-(cmp?18:28);
      return `<polyline points="${n1(l.x,l.y)} ${n1(xc,l.ty)} ${xf},${l.ty.toFixed(1)}" class="t3Guia" style="stroke:${l.g.col[1]}"/>
        <circle cx="${l.x.toFixed(1)}" cy="${l.y.toFixed(1)}" r="3.5" style="fill:${l.g.col[1]}"/>
        <text x="${lado>0?xf+9:xf-9}" y="${l.ty-(cmp?6:4)}" text-anchor="${lado>0?"start":"end"}" class="t3K" style="fill:${l.g.col[1]}">${l.g.k}</text>
        <text x="${lado>0?xf+9:xf-9}" y="${l.ty+(cmp?12:13)}" text-anchor="${lado>0?"start":"end"}" class="t3V">${fmt(l.g.v)}</text>
        <text x="${lado>0?xf+9:xf-9}" y="${l.ty+(cmp?28:13)}" text-anchor="${lado>0?"start":"end"}" class="t3P" ${cmp?"":`dx="${lado>0?92:-92}"`}>${(l.g.p*100).toFixed(1)}%</text>`;
    }).join("");
  };
  /* de atrás hacia adelante: cada gajo completo antes del siguiente */
  const orden=[...gajos].sort((a,b)=>Math.sin(a.am)-Math.sin(b.am));
  const H=cmp ? Math.max(420, 96+Math.max(der.length,izq.length)*salto+44)
              : Math.max(340, 70+Math.max(der.length,izq.length)*48+40);
  /* en la hoja impresa la torta y la leyenda son dos piezas: así todas las tortas
     quedan a la misma altura y las leyendas arrancan sobre la misma línea */
  if(cmp){
    const Hc=300, paso=30;
    const cl=g=>rk?` class="tocable" onclick="detGraf('${rk}','${String(g.k).replace(/\\/g,"").replace(/'/g,"\\'")}')"`:"";
    const filas=gajos.map((g,i)=>{ const y=21+i*paso;
      return `<g${cl(g)}><rect x="14" y="${y-15}" width="${W-28}" height="${paso}" class="tFondo"/>
        <rect x="18" y="${y-13}" width="15" height="15" rx="2" style="fill:${g.col[0]}"/>
        <text x="43" y="${y}" class="t3K" style="fill:${g.col[1]}">${g.k}</text>
        <text x="${W-96}" y="${y}" text-anchor="end" class="t3V">${fmt(g.v)}</text>
        <text x="${W-14}" y="${y}" text-anchor="end" class="t3P">${(g.p*100).toFixed(1)}%</text>
        <line x1="18" y1="${y+12}" x2="${W-14}" y2="${y+12}" class="t3Fila"/></g>`; }).join("");
    return {
      pie:`<svg viewBox="0 0 ${W} ${Hc}" class="chartSvg" preserveAspectRatio="xMidYMid meet">
        <defs>${defs}<radialGradient id="${U}base" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0.7" stop-color="#000" stop-opacity="0.10"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs>
        <ellipse cx="${cx}" cy="${cy+prof+6}" rx="${rx+22}" ry="${ry*0.5}" fill="url(#${U}base)"/>
        ${orden.map(g=>`<g${cl(g)}>${cuerpo(g)}${tapa(g)}</g>`).join("")}
        ${gajos.filter(g=>g.p>=0.13).map(g=>{
          const x=cx+rx*0.58*Math.cos(g.am)+g.ox, y=cy+ry*0.58*Math.sin(g.am)+g.oy;
          const L=dosLineas(g.k), y0=L.length>1 ? y-3 : y+8;
          return `<text x="${x.toFixed(1)}" y="${y0.toFixed(1)}" class="t3Dentro">${
            L.map((t,i)=>`<tspan x="${x.toFixed(1)}" dy="${i?23:0}">${t}</tspan>`).join("")}</text>`;
        }).join("")}</svg>`,
      leg:`<svg viewBox="0 0 ${W} ${gajos.length*paso+14}" class="chartSvg" preserveAspectRatio="xMinYMin meet">
        ${filas}</svg>`
    };
  }
  return `<div class="chartBox tortaBox">
   <div class="chartTit">PARTICIPACIÓN POR ${et}<span>total ${fmt(total)}</span></div>
   <svg viewBox="0 0 ${W} ${H}" class="chartSvg tortaSvg" preserveAspectRatio="xMidYMid meet">
     <defs>${defs}
       <radialGradient id="${U}base" cx="0.5" cy="0.5" r="0.5">
         <stop offset="0.7" stop-color="#000" stop-opacity="0.10"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
     </defs>
     <ellipse cx="${cx}" cy="${cy+prof+6}" rx="${rx+26}" ry="${ry*0.5}" fill="url(#${U}base)"/>
     ${orden.map(g=>cuerpo(g)+tapa(g)).join("")}
     ${acomodar(der,1)}${acomodar(izq,-1)}
   </svg>
  </div>`;
}

/* ---------- FLUJO DE FONDOS ---------- */
function finFlujo(D,H,M){
  const CTAS=M.cuentas.filter(c=>!["DESACOPIO","SOBREPRECIO"].includes(c));
  let filas="", tIni=0,tEnt=0,tSal=0,tFin=0;
  for(const c of CTAS){
    const ini=saldoAl(c,diaAnterior(D)), fin=saldoAl(c,H);
    const r=q(`SELECT
      COALESCE(SUM(CASE WHEN (categ='VENTAS' AND cuenta=?) OR (tcbte='M.INT.' AND ctadest=?) THEN ${TOTAL} END),0) e,
      COALESCE(SUM(CASE WHEN cuenta=? AND NOT (categ='VENTAS') THEN ${TOTAL} END),0) s
      FROM mov WHERE pago BETWEEN ? AND ?`,[c,c,c,D,H])[0];
    tIni+=ini; tEnt+=r.e; tSal+=r.s; tFin+=fin;
    const pend=q(`SELECT COUNT(*) n FROM mov WHERE pago>? AND ((cuenta=? AND COALESCE(categ,'')<>'VENTAS')
       OR (categ='VENTAS' AND cuenta=?) OR (tcbte='M.INT.' AND ctadest=?))`,[hoy,c,c,c])[0].n;
    filas+=`<tr class="${c===FINPROY?"on":""}" onclick="FINPROY='${c===FINPROY?"":c}';renderFin()">
      <td><b>${c}</b></td><td class="num">${fmt(ini)}</td><td class="num">${fmt(r.e)}</td>
      <td class="num neg">${fmt(r.s)}</td><td class="num tot">${fmt(fin)}</td>
      <td class="num ${fin-ini<0?"neg":""}">${fmt(fin-ini)}</td>
      <td class="num g">${pend||"·"}</td></tr>`;
  }
  return tb([["CUENTA"],["SALDO INICIAL","num"],["ENTRADAS","num"],["SALIDAS","num"],["SALDO FINAL","num"],["VARIACIÓN","num"],["A VENCER","num"]],filas,
     `<td>TOTAL</td><td class="num">${fmt(tIni)}</td><td class="num">${fmt(tEnt)}</td><td class="num">${fmt(tSal)}</td>
      <td class="num">${fmt(tFin)}</td><td class="num">${fmt(tFin-tIni)}</td><td></td>`)
   + graficoFlujo(D,H,M)
   + `<div class="rpNota">Movimiento de cada cuenta en el mes. Las transferencias internas entran y salen: no cambian el total.
      · Tocá una cuenta para ver el detalle de sus cheques diferidos y pagos futuros.</div>`
   + (FINPROY?proyeccion(FINPROY):"");
}

/* ---------- PROYECCIÓN FINANCIERA DE UNA CUENTA ---------- */
function proyeccion(c){
  const saldoHoy=saldoAl(c,hoy);
  const mv=q(`SELECT *, ${TOTAL} tt FROM mov WHERE pago>? AND ((cuenta=? AND COALESCE(categ,'')<>'VENTAS')
     OR (categ='VENTAS' AND cuenta=?) OR (tcbte='M.INT.' AND ctadest=?)) ORDER BY pago, id`,[hoy,c,c,c]);
  let s=saldoHoy, sale=0, entra=0, rojo="", filas="";
  for(const r of mv){
    const esEnt=(r.categ==="VENTAS"&&r.cuenta===c)||(r.tcbte==="M.INT."&&r.ctadest===c);
    s += esEnt ? r.tt : -r.tt;
    if(esEnt) entra+=r.tt; else sale+=r.tt;
    if(s<0 && !rojo) rojo=r.pago;
    const dif=(r.tipo||"").startsWith("CHEQUE");
    filas+=`<tr onclick="abrirVista(${r.id})" class="${s<0?"cNo":""}">

      <td>${dif?`<b>${r.tipo}</b>`:(r.tipo||r.tcbte||"")}</td><td class="num g">${r.cheque||""}</td>
