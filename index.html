   ${rojo?`<div class="proyAlerta">⚠ La cuenta queda en descubierto el <b>${rojo}</b>. Hay que anticipar cobranza o refinanciar antes de esa fecha.</div>`:""}
   ${mv.length?tb([["VENCE"],["EN","num"],["FORMA DE PAGO"],["N° CHEQUE","num"],["CONCEPTO"],["PROVEEDOR / DESTINO"],["ENTRA","num"],["SALE","num"],["SALDO PROYECTADO","num"]],filas)
     :`<div class="rpNota">Esta cuenta no tiene pagos ni cobros pendientes.</div>`}
  </div>`;
}

/* ---------- IMPUESTOS ---------- */
function finImp(D,H){
  const r=q(`SELECT COALESCE(sub,'—') k, COALESCE(prov,'—') p, SUM(${TOTAL}) t, COUNT(*) n
    FROM mov WHERE categ='IMPTOS' AND pago BETWEEN ? AND ? GROUP BY k,p ORDER BY t DESC`,[D,H]);
  const G=r.reduce((a,x)=>a+x.t,0);
  return tarj([["IMPUESTOS DEL MES",G,"tt"],["COMPROBANTES",r.reduce((a,x)=>a+x.n,0)]])
   + tb([["IMPUESTO"],["ORGANISMO"],["COMPROB.","num"],["IMPORTE","num"],["%","num"]],
     r.map(x=>`<tr><td><b>${x.k}</b></td><td>${x.p}</td><td class="num g">${x.n}</td>
       <td class="num tot">${fmt(x.t)}</td><td class="num g">${G?(x.t/G*100).toFixed(1):0}%</td></tr>`).join("")
       ||`<tr><td colspan="5" class="g">Sin impuestos en el mes.</td></tr>`,
     `<td colspan="2">TOTAL</td><td class="num">${r.reduce((a,x)=>a+x.n,0)}</td><td class="num">${fmt(G)}</td><td class="num">100%</td>`);
}

/* ---------- IVA · POSICIONES ---------- */
function finIva(D,H){
  let filas="", tD=0,tC=0,tR=0;
  for(let m=1;m<=12;m++){
    const fin=new Date(RPTANIO,m,0).getDate(), p=n=>String(n).padStart(2,"0");
    const d=`${RPTANIO}-${p(m)}-01`, h=`${RPTANIO}-${p(m)}-${fin}`;
    const r=q(`SELECT
      COALESCE(SUM(CASE WHEN categ='VENTAS' THEN iva END),0) deb,
      COALESCE(SUM(CASE WHEN COALESCE(categ,'')<>'VENTAS' THEN iva END),0) cre,
      COALESCE(SUM(ivarp),0) rp, COUNT(*) n FROM mov WHERE emis BETWEEN ? AND ?`,[d,h])[0];
    if(!r.n) continue;
    const pos=r.deb-r.cre-r.rp;
    tD+=r.deb; tC+=r.cre; tR+=r.rp;
    filas+=`<tr><td><b>${MESES[m-1][0]+MESES[m-1].slice(1).toLowerCase()}</b></td>
      <td class="num">${fmt(r.deb)}</td><td class="num">${fmt(r.cre)}</td><td class="num">${fmt(r.rp)}</td>
      <td class="num tot ${pos<0?"neg":""}">${fmt(pos)}</td>
      <td class="g">${pos>0?"a pagar":"saldo a favor"}</td></tr>`;
  }
  const pos=tD-tC-tR;
  return tarj([["IVA DÉBITO · ventas",tD],["IVA CRÉDITO · compras",tC],["RET. Y PERC. SUFRIDAS",tR],
               [pos>0?"POSICIÓN A PAGAR":"SALDO A FAVOR",Math.abs(pos),"tt"]])
   + tb([["MES"],["DÉBITO · ventas","num"],["CRÉDITO · compras","num"],["RET/PERC.","num"],["POSICIÓN","num"],["ESTADO"]],filas,
     `<td>AÑO ${RPTANIO}</td><td class="num">${fmt(tD)}</td><td class="num">${fmt(tC)}</td>
      <td class="num">${fmt(tR)}</td><td class="num">${fmt(pos)}</td><td></td>`)
   + `<div class="rpNota">Por fecha de emisión, que es la que define la posición. Débito menos crédito menos lo que ya nos retuvieron.</div>`
   + detalleImp('iva',D,H);
}

/* ---------- INGRESOS BRUTOS Y GANANCIAS · mismo formato que IVA ---------- */
function finImpuesto(k,D,H){
  const I=IMPS[k], c=I.campo;
  let filas="", tP=0,tR=0,tN=0;
  for(let m=1;m<=12;m++){
    const fin=new Date(RPTANIO,m,0).getDate(), p=n=>String(n).padStart(2,"0");
    const d=`${RPTANIO}-${p(m)}-01`, hh=`${RPTANIO}-${p(m)}-${fin}`;
    const r=q(`SELECT COALESCE(SUM(CASE WHEN ${c}>0 THEN ${c} END),0) per,
      COALESCE(SUM(CASE WHEN ${c}<0 THEN -${c} END),0) ret, COUNT(*) n
      FROM mov WHERE emis BETWEEN ? AND ? AND ${c}<>0`,[d,hh])[0];
    if(!r.n) continue;
    tP+=r.per; tR+=r.ret; tN+=r.n;
    filas+=`<tr><td><b>${MESES[m-1][0]+MESES[m-1].slice(1).toLowerCase()}</b></td>
      <td class="num g">${r.n}</td><td class="num">${fmt(r.per)}</td><td class="num">${fmt(r.ret)}</td>
      <td class="num tot">${fmt(r.per+r.ret)}</td><td class="g">pago a cuenta</td></tr>`;
  }
  return tarj([["PERCEPCIONES SUFRIDAS",tP],["RETENCIONES SUFRIDAS",tR],
               ["COMPROBANTES",tN],["TOTAL A FAVOR",tP+tR,"tt"]])
   + tb([["MES"],["COMPROB.","num"],["PERCEPCIONES","num"],["RETENCIONES","num"],["TOTAL A FAVOR","num"],["ESTADO"]],filas,
     `<td>AÑO ${RPTANIO}</td><td class="num">${tN}</td><td class="num">${fmt(tP)}</td>
      <td class="num">${fmt(tR)}</td><td class="num">${fmt(tP+tR)}</td><td></td>`)
   + `<div class="rpNota">Por fecha de emisión. Percepciones y retenciones sufridas de ${I.tit} son pago a cuenta:
      plata ya ingresada al fisco a nombre de la empresa. El impuesto determinado lo liquida el contador con estos comprobantes.</div>`
   + detalleImp(k,D,H);
}

/* ---------- DETALLES PARA EL CONTADOR ----------
   Percepciones y retenciones sufridas son pagos a cuenta: van A FAVOR.
   En contra está el impuesto determinado. Se separan por signo, como en el libro:
   la percepción llega con signo + (la agrega el proveedor) y la retención con signo − . */
const IMPS={
  iva :{campo:"ivarp", tit:"IVA",             col:"IVA"},
  iibb:{campo:"iibb",  tit:"INGRESOS BRUTOS", col:"IIBB"},
  gcia:{campo:"gcia",  tit:"GANANCIAS",       col:"GCIA"}
};
function filasImp(k,D,H){
  const c=IMPS[k].campo;
  const cond = k==="iva" ? "(iva<>0 OR ivarp<>0)" : `${c}<>0`;
  return q(`SELECT *, ${TOTAL} tt FROM mov WHERE emis BETWEEN ? AND ? AND ${cond} ORDER BY emis, id`,[D,H]);
}
function detalleImp(k,D,H){
  const I=IMPS[k], r=filasImp(k,D,H), mes=`${MESES[RPTMES-1]} ${RPTANIO}`;
  const s={neto:0,imp:0,per:0,ret:0,tt:0};
  const filas=r.map(x=>{
    const v=x[I.campo]||0, per=v>0?v:0, ret=v<0?-v:0, ven=x.categ==="VENTAS";
    s.neto+=x.neto; s.imp+=(k==="iva"?x.iva:0); s.per+=per; s.ret+=ret; s.tt+=x.tt;
    return `<tr onclick="abrirVista(${x.id})"><td class="num g">${x.id}</td><td>${x.emis}</td>
      <td>${x.tcbte||""}</td><td class="num">${x.cbte||""}</td>
      <td>${x.prov||""}</td><td>${ven?"VENTA":(x.tipo||"")}</td>
      <td class="num">${fmt(x.neto)}</td>
      ${k==="iva"?`<td class="num ${ven?"tot":""}">${x.iva?fmt(x.iva):""}</td>`:""}
      <td class="num">${per?fmt(per):""}</td><td class="num">${ret?fmt(ret):""}</td>
      <td class="num tot">${fmt(x.tt)}</td></tr>`;
  }).join("");
  const cols=[["N°","num"],["EMISIÓN"],["CBTE"],["N° CBTE","num"],["PROVEEDOR / CLIENTE"],["MEDIO DE PAGO"],["NETO","num"]]
    .concat(k==="iva"?[["IVA","num"]]:[])
    .concat([[`PERCEPCIONES ${I.col}`,"num"],[`RETENCIONES ${I.col}`,"num"],["TOTAL","num"]]);
  const tot=`<td colspan="6">TOTALES ${mes}</td><td class="num">${fmt(s.neto)}</td>`
    +(k==="iva"?`<td class="num">${fmt(s.imp)}</td>`:"")
    +`<td class="num">${fmt(s.per)}</td><td class="num">${fmt(s.ret)}</td><td class="num">${fmt(s.tt)}</td>`;
  return `<div class="proyBox">
   <div class="proyTit">DETALLE ${I.tit} · <b>${mes}</b>
     <span>${r.length} comprobante${r.length===1?"":"s"}</span>
     <button class="btnCsv" onclick="csvImp('${k}')">DESCARGAR CSV</button></div>
   ${r.length?tb(cols,filas,tot):`<div class="rpNota">Sin comprobantes de ${I.tit} en el mes.</div>`}
   <div class="rpNota">
     <b>A favor:</b> percepciones ${fmt(s.per)} + retenciones ${fmt(s.ret)} = <b>${fmt(s.per+s.ret)}</b> de pago a cuenta.
     Las dos son plata ya ingresada al fisco a nombre de la empresa.
     ${k==="iva"?`<b>En contra:</b> el impuesto determinado del mes, que sale del cuadro de posiciones de arriba.`
                :`<b>En contra:</b> el impuesto determinado de ${I.tit}, que liquida el contador con estos comprobantes.`}
   </div></div>`;
}
function csvImp(k){
  const I=IMPS[k], [D,H]=rangoMes(), r=filasImp(k,D,H);
  const n=v=>String(Math.round(v||0));
  const cab=["N","EMISION","CBTE","N CBTE","PROVEEDOR/CLIENTE","MEDIO DE PAGO","NETO"]
    .concat(k==="iva"?["IVA"]:[]).concat(["PERCEPCIONES "+I.col,"RETENCIONES "+I.col,"TOTAL"]);
  const lin=r.map(x=>{const v=x[I.campo]||0, ven=x.categ==="VENTAS";
    return [x.id,x.emis,x.tcbte||"",x.cbte||"",(x.prov||"").replace(/;/g,","),ven?"VENTA":(x.tipo||""),n(x.neto)]
      .concat(k==="iva"?[n(x.iva)]:[]).concat([n(v>0?v:0),n(v<0?-v:0),n(x.tt)]).join(";");});
  const csv="\uFEFF"+[cab.join(";"),...lin].join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=`${I.tit.replace(/ /g,"_")}_${RPTANIO}_${String(RPTMES).padStart(2,"0")}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- RETENCIONES Y PERCEPCIONES ---------- */
function finRet(D,H){
  const r=q(`SELECT COALESCE(prov,'—') p,
     COALESCE(SUM(ivarp),0) a, COALESCE(SUM(gcia),0) b, COALESCE(SUM(iibb),0) c, COUNT(*) n
     FROM mov WHERE pago BETWEEN ? AND ? AND (ivarp<>0 OR gcia<>0 OR iibb<>0)
     GROUP BY p ORDER BY (COALESCE(SUM(ivarp),0)+COALESCE(SUM(gcia),0)+COALESCE(SUM(iibb),0)) DESC`,[D,H]);
  const A=r.reduce((x,y)=>x+y.a,0), B=r.reduce((x,y)=>x+y.b,0), C=r.reduce((x,y)=>x+y.c,0);
  return tarj([["IVA RET/PERC.",A],["GANANCIAS",B],["INGRESOS BRUTOS",C],["TOTAL DEL MES",A+B+C,"tt"]])
   + tb([["PROVEEDOR"],["COMPROB.","num"],["IVA RET/PERC.","num"],["GANANCIAS","num"],["IIBB","num"],["TOTAL","num"]],
     r.map(x=>`<tr><td><b>${x.p}</b></td><td class="num g">${x.n}</td><td class="num">${fmt(x.a)}</td>
       <td class="num ${x.b<0?"neg":""}">${fmt(x.b)}</td><td class="num">${fmt(x.c)}</td>
       <td class="num tot">${fmt(x.a+x.b+x.c)}</td></tr>`).join("")
       ||`<tr><td colspan="6" class="g">Sin retenciones ni percepciones en el mes.</td></tr>`,
     `<td>TOTAL</td><td class="num">${r.reduce((x,y)=>x+y.n,0)}</td><td class="num">${fmt(A)}</td>
      <td class="num">${fmt(B)}</td><td class="num">${fmt(C)}</td><td class="num">${fmt(A+B+C)}</td>`);
}

/* ---------- CONCILIACIÓN BANCARIA ---------- */
let CONCTXT="", CONCRES=null;
function conciliar(){
  CONCTXT=$("#conc_txt").value;
  const tol=parseFloat($("#conc_tol").value.replace(/\./g,""))||0;
  const dias=parseInt($("#conc_dias").value)||0;
  FINTOL=tol; FINDIAS=dias;
  const lineas=CONCTXT.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split(/[;\t,]/).map(x=>x.trim());
    const f=(p[0]||"").replace(/\//g,"-").split("-");
    const fecha = f.length===3 ? (f[0].length===4?`${f[0]}-${f[1].padStart(2,"0")}-${f[2].padStart(2,"0")}`
                                                 :`${f[2]}-${f[1].padStart(2,"0")}-${f[0].padStart(2,"0")}`) : "";
    const num=s=>parseFloat(String(s||"0").replace(/\./g,"").replace(",","."))||0;
    return {fecha, desc:p[1]||"", deb:num(p[2]), cre:num(p[3])};
  }).filter(x=>x.fecha);
  const [D,H]=rangoMes();
  const libro=q(`SELECT *, ${TOTAL} tt FROM mov WHERE cuenta=? AND pago BETWEEN ? AND ?`,[FINBCO,D,H]);
  const usados=new Set();
  CONCRES=lineas.map(l=>{
    const imp=l.deb||l.cre;
    const cand=libro.filter(m=>!usados.has(m.id) && Math.abs(Math.abs(m.tt)-imp)<=tol
       && Math.abs((new Date(m.pago)-new Date(l.fecha))/86400000)<=dias);
    if(cand.length){ usados.add(cand[0].id); return {...l, est:"✓", mov:cand[0]}; }
    return {...l, est:"✗", mov:null};
  });
  CONCRES.libroSuelto=libro.filter(m=>!usados.has(m.id));
  renderFin();
}
function finConc(D,H,M){
  const R=CONCRES;
  const ok=R?R.filter(x=>x.est==="✓").length:0, mal=R?R.length-ok:0;
  const sueltos=R?R.libroSuelto.length:0;
  return `<div class="concCfg">
     <div><small>EXTRACTO DEL BANCO — pegá las líneas: fecha ; concepto ; débito ; crédito</small>
       <textarea id="conc_txt" rows="4" placeholder="05/07/2026 ; TRANSFERENCIA PROVEEDOR ; 1.250.000 ; ">${CONCTXT}</textarea></div>
     <div class="concLat">
       <label>TOLERANCIA $<input id="conc_tol" class="numIn" value="${fmt(FINTOL)}" oninput="sepMil(this)"></label>
       <label>TOLERANCIA DÍAS<input id="conc_dias" type="number" value="${FINDIAS}"></label>
       <button class="btn navy" onclick="conciliar()">CONCILIAR</button>
     </div>
   </div>
   ${R?tarj([["LÍNEAS DEL BANCO",R.length],["CONCILIADAS",ok,"tt"],["SIN MATCH",mal],["EN EL LIBRO Y NO EN EL BANCO",sueltos]]):""}
   ${R?tb([["EST."],["FECHA"],["CONCEPTO DEL BANCO"],["DÉBITO","num"],["CRÉDITO","num"],["N° LIBRO","num"],["CONCEPTO DEL LIBRO"],["IMPORTE","num"]],
     R.map(x=>`<tr class="${x.est==="✓"?"cOk":"cNo"}">
       <td class="cEst">${x.est}</td><td>${x.fecha.slice(5)}</td><td>${x.desc}</td>
       <td class="num neg">${x.deb?fmt(x.deb):""}</td><td class="num">${x.cre?fmt(x.cre):""}</td>
       <td class="num g">${x.mov?x.mov.id:""}</td><td>${x.mov?x.mov.concepto:"— sin correspondencia —"}</td>
       <td class="num tot">${x.mov?fmt(x.mov.tt):""}</td></tr>`).join("")):""}
   ${R&&sueltos?`<div class="rpNota">Movimientos del libro sin línea en el banco:</div>`
     +tb([["N°","num"],["PAGO"],["CONCEPTO"],["PROVEEDOR"],["IMPORTE","num"]],
       R.libroSuelto.map(m=>`<tr onclick="abrirVista(${m.id})"><td class="num g">${m.id}</td><td>${m.pago.slice(5)}</td>
         <td>${m.concepto||""}</td><td>${m.prov||""}</td><td class="num tot">${fmt(m.tt)}</td></tr>`).join("")):""}
   <div class="rpNota">Cruza por importe y fecha con las tolerancias indicadas, sobre <b>${FINBCO}</b> en el mes elegido.</div>`;
}

        ${det.length>40?`<div class="rmMas">y ${det.length-40} movimientos más</div>`:""}</div>
    </div>`;
  };
  return `<div class="rpMob">
   <div class="rmSel">
     <select onchange="verReporte(this.value)">${Object.entries(RPT).map(([k,v])=>`<option value="${k}" ${k===RPTTIPO?"selected":""}>${v.tit}</option>`).join("")}</select>
     <div class="rmPer">
       <select onchange="RPTMES=+this.value;RPTFILA='';renderRep()">${MESES.map((m,i)=>`<option value="${i+1}" ${i+1===RPTMES?"selected":""}>${m[0]+m.slice(1).toLowerCase()}</option>`).join("")}</select>
       <select onchange="RPTANIO=+this.value;RPTFILA='';renderRep()">${anios.map(a=>`<option ${a===RPTANIO?"selected":""}>${a}</option>`).join("")}</select>
     </div>
   </div>
   <div class="rmTot"><small>TOTAL GASTADO · ${mes.toUpperCase()}</small><b>${fmt(G)}</b>
     <span>${nMov} asiento${nMov===1?"":"s"} · ${keys.length} ${R.et.toLowerCase()}</span></div>
   <div class="rmLista">${keys.map(k=>`<div class="rmIt ${k===RPTFILA?"on":""}" onclick="RPTFILA='${k===RPTFILA?"":k}';renderRep()">
     <div class="rmTxt"><span>${k}</span><b>${fmt(totK(k))}</b></div>
     <div class="rmBar"><i style="width:${(totK(k)/mx*100).toFixed(1)}%"></i><em>${G?(totK(k)/G*100).toFixed(1):0}%</em></div>
     ${k===RPTFILA?sub(k):""}
   </div>`).join("")}</div>
   <div class="rmPie">Tocá un ${R.et.toLowerCase()} para abrirlo por obra y ver sus movimientos.</div>
  </div>`;
}

/* ==================== REPORTES DE GASTOS ====================
   Un solo motor: matriz de una dimensión contra las obras, con detalle al tocar una fila.
   Gasto = todo menos ventas, movimientos internos y compras de acopio (el acopio es stock;
   lo que sí es gasto es el desacopio y su sobreprecio). */
const GASTO = "COALESCE(categ,'')<>'VENTAS' AND COALESCE(categ,'')<>'FONDO RESERVA' AND COALESCE(tcbte,'')<>'M.INT.' "
            + "AND NOT (COALESCE(categ,'')='ACOPIO' AND COALESCE(cuenta,'') NOT IN ('DESACOPIO','SOBREPRECIO'))";
const RPT = {
  obra : {tit:"GASTOS POR OBRA",         dim:"categ", et:"CATEGORÍA",     f:"", nota:"Cada categoría contra cada obra. La columna es el costo de la obra."},
  prov : {tit:"GASTOS POR PROVEEDOR",    dim:"prov",  et:"PROVEEDOR",     f:"", nota:"Quién nos vende y a qué obra fue."},
  mo   : {tit:"GASTOS DE MANO DE OBRA",  dim:"sub",   et:"CONCEPTO",      f:"categ='Mano Obra'", nota:"Jornales, contratistas, cargas y premios."},
  mat  : {tit:"GASTOS DE MATERIALES",    dim:"sub",   et:"MATERIAL",      f:"categ IN ('Materiales','ACOPIO')", nota:"Incluye los desacopios: el acopio pesa recién cuando se imputa a la obra."},
  eq   : {tit:"GASTOS x EQUIPOS / MAQ.", dim:"sub",   et:"EQUIPO",        f:"categ='Equipos'", nota:"Alquileres y fletes."},
  gral : {tit:"GASTOS GENERALES",        dim:"categ", et:"RUBRO",         f:"categ IN ('Gtos Grales','Insumos Vs','IMPTOS')", nota:"Gastos generales, insumos e impuestos."}
};
let RPTTIPO="obra", RPTMES=0, RPTANIO=0, RPTFILA="";
/* los reportes son mensuales: el período sale del mes y el año elegidos */
function rangoMes(){
  const fin=new Date(RPTANIO,RPTMES,0).getDate(), p=n=>String(n).padStart(2,"0");
  return [`${RPTANIO}-${p(RPTMES)}-01`,`${RPTANIO}-${p(RPTMES)}-${fin}`];
}
function verReporte(t){ RPTTIPO=t; RPTFILA=""; nav("rep"); }
function renderRep(){
  const M=window.DATOS.maestros, R=RPT[RPTTIPO];
  if(!RPTMES){ RPTMES=+hoy.slice(5,7); RPTANIO=+hoy.slice(0,4); }
  const anios=q("SELECT DISTINCT substr(pago,1,4) a FROM mov ORDER BY 1").map(x=>+x.a);
  if(!anios.includes(RPTANIO)) RPTANIO=anios[anios.length-1];
  const [RPTD,RPTH]=rangoMes();
  const wh=[GASTO,"pago BETWEEN ? AND ?"], pr=[RPTD,RPTH];
  if(R.f) wh.push(R.f);
  const W=wh.join(" AND ");
  const filas=q(`SELECT COALESCE(${R.dim},'—') k, COALESCE(obra,'— sin obra —') o, SUM(${TOTAL}) t, COUNT(*) n
    FROM mov WHERE ${W} GROUP BY k,o`,pr);
  const obras=[...new Set(filas.map(x=>x.o))].sort();
  const keys=[...new Set(filas.map(x=>x.k))];
  const val=(k,o)=>{ const x=filas.find(f=>f.k===k&&f.o===o); return x?x.t:0; };
  const totK=k=>filas.filter(f=>f.k===k).reduce((a,f)=>a+f.t,0);
  const totO=o=>filas.filter(f=>f.o===o).reduce((a,f)=>a+f.t,0);
  const G=filas.reduce((a,f)=>a+f.t,0);
  keys.sort((a,b)=>totK(b)-totK(a));
  const det = RPTFILA ? q(`SELECT p.* FROM (SELECT *, ${TOTAL} tt FROM mov) p WHERE ${W} AND COALESCE(${R.dim},'—')=?
     ORDER BY pago DESC LIMIT 300`,[...pr,RPTFILA]) : [];
  $("#app").innerHTML=`
  <div class="barra rpBar">
    ${Object.entries(RPT).map(([k,v])=>`<button class="rpTab ${k===RPTTIPO?"on":""}" onclick="verReporte('${k}')">${v.tit.replace("GASTOS ","").replace("GASTOS","TOTALES")}</button>`).join("")}

  </div>
  <div class="rpWrap"><div class="rpBox">
   ${cabPrint(R.tit,perMes())}
   <div class="rpPer">
     <select onchange="RPTMES=+this.value;RPTFILA='';renderRep()">${MESES.map((m,i)=>`<option value="${i+1}" ${i+1===RPTMES?"selected":""}>${m[0]+m.slice(1).toLowerCase()}</option>`).join("")}</select>
     <select onchange="RPTANIO=+this.value;RPTFILA='';renderRep()">${anios.map(a=>`<option ${a===RPTANIO?"selected":""}>${a}</option>`).join("")}</select>
   </div>
   <table class="coTab rpTab2">
    <thead><tr><th>${R.et}</th>${obras.map(o=>`<th class="num">${o}</th>`).join("")}<th class="num">TOTAL</th><th class="num">%</th></tr></thead>
    <tbody>${keys.map(k=>`<tr class="${k===RPTFILA?"on":""}" onclick="RPTFILA='${k===RPTFILA?"":k}';renderRep()">
      <td><b>${k}</b></td>
      ${obras.map(o=>{const v=val(k,o); return `<td class="num ${v?"":"g"}">${v?fmt(v):"·"}</td>`}).join("")}
      <td class="num tot">${fmt(totK(k))}</td>
      <td class="num g">${G?(totK(k)/G*100).toFixed(1):0}%</td></tr>`).join("")}
     <tr class="coTot"><td>TOTAL</td>${obras.map(o=>`<td class="num">${fmt(totO(o))}</td>`).join("")}
      <td class="num">${fmt(G)}</td><td class="num">100%</td></tr>
    </tbody></table>
   <div class="rpNota">${R.nota} · Tocá una fila para ver su detalle.</div>
   ${RPTFILA?"":graficoTorta(keys.map(k=>({k,v:totK(k)})).filter(x=>x.v>0),G,R.et)}
   ${RPTFILA?`<div class="rpDet">
     <div class="rpDetTit">DETALLE · <b>${RPTFILA}</b> <span>${det.length} movimiento${det.length===1?"":"s"}</span>
       <button class="rpX" onclick="RPTFILA='';renderRep()">✕</button></div>
     <table class="coTab rpTab2"><thead><tr><th class="num">N°</th><th>PAGO</th><th>CUENTA</th><th>CONCEPTO</th>
       <th>PROVEEDOR</th><th>OBRA</th><th>ETAPA</th><th class="num">NETO</th><th class="num">TOTAL</th></tr></thead>
      <tbody>${det.map(r=>`<tr onclick="abrirVista(${r.id})">
       <td class="num g">${r.id}</td><td>${(r.pago||"").slice(5)}</td><td>${r.cuenta||""}</td>
       <td>${r.concepto||""}</td><td>${r.prov||""}</td><td>${r.obra||""}</td><td>${r.etapa||""}</td>
       <td class="num">${fmt(r.neto)}</td><td class="num tot">${fmt(r.tt)}</td></tr>`).join("")}
       <tr class="coTot"><td colspan="7">TOTAL ${RPTFILA} · ${det.length} movimiento${det.length===1?"":"s"}</td>
        <td class="num">${fmt(det.reduce((a,r)=>a+(r.neto||0),0))}</td>
        <td class="num">${fmt(det.reduce((a,r)=>a+(r.tt||0),0))}</td></tr></tbody></table>
   </div>`:""}
  </div></div>
  ${repMobil(keys,obras,val,totK,totO,G,filas,det,R)}
  ${modalAlta(window.DATOS.maestros)}`;
}

/* ==================== STOCK DE ACOPIOS ====================
   Un acopio vive por proveedor + material. La compra suma; el desacopio resta.
   El precio unitario sale del saldo: lo que queda en plata sobre lo que queda en unidades. */
let ACOPSEL=null, ACOPCANT="", ACOPPCT="0", ACOPEXTRA=null;
const fmt2 = n => (n==null||isNaN(n))?"—":Number(n).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
function stockAcopios(){
  return q(`SELECT prov, sub,
      SUM(CASE WHEN COALESCE(cuenta,'') NOT IN ('DESACOPIO','SOBREPRECIO') THEN COALESCE(cant,0) ELSE 0 END) cAc,
      SUM(CASE WHEN COALESCE(cuenta,'') NOT IN ('DESACOPIO','SOBREPRECIO') THEN COALESCE(neto,0) ELSE 0 END) mAc,
      SUM(CASE WHEN cuenta='DESACOPIO' THEN COALESCE(cant,0) ELSE 0 END) cDe,
      SUM(CASE WHEN cuenta='DESACOPIO' THEN COALESCE(neto,0) ELSE 0 END) mDe
    FROM mov WHERE categ='ACOPIO' AND prov IS NOT NULL GROUP BY prov, sub ORDER BY prov`)
   .map(r=>({...r, cSal:r.cAc-r.cDe, mSal:r.mAc-r.mDe, unit:(r.cAc-r.cDe)>0?(r.mAc-r.mDe)/(r.cAc-r.cDe):null}))
   .filter(r=>r.mSal>0.5 || r.cSal>0.001);
}
function abrirAcopios(){
  ACOPSEL=null; ACOPCANT=""; ACOPPCT="0";
  pintarAcopios(); $("#acop").classList.remove("oculto"); trabarFondo(true);
}
function cerrarAcopios(){ $("#acop").classList.add("oculto"); trabarFondo(false); }
function pintarAcopios(){
  const S=stockAcopios();
  const sel=ACOPSEL!==null?S[ACOPSEL]:null;
  const cant=parseFloat(String(ACOPCANT).replace(",","."))||0;
  const pct=parseFloat(String(ACOPPCT).replace(",","."))||0;
  const unitAj=sel&&sel.unit!=null?sel.unit*(1+pct/100):null;
  const importe=unitAj!=null?Math.round(cant*unitAj):0;
  const excede=sel&&sel.cSal>0&&cant>sel.cSal;
  $("#acopBody").innerHTML = `
   ${S.length?`<table class="acopTab"><thead><tr><th>PROVEEDOR</th><th>MATERIAL</th><th class="num">QUEDA</th>
     <th class="num">$ UNIT.</th><th class="num">SALDO $</th></tr></thead>
     <tbody>${S.map((r,i)=>`<tr class="${i===ACOPSEL?'on':''}" onclick="ACOPSEL=${i};ACOPCANT='';pintarAcopios()">
       <td><b>${r.prov}</b></td><td>${r.sub||"—"}</td>
       <td class="num"><b>${fmt(r.cSal)}</b></td>
       <td class="num g">${r.unit!=null?fmt2(r.unit):"—"}</td>
       <td class="num tot">${fmt(r.mSal)}</td></tr>`).join("")}</tbody></table>`
    :`<div class="acopVacio">No hay acopios con saldo. Se cargan como un gasto común con categoría <b>ACOPIO</b>,
      con su proveedor, la cantidad y el material en Sub-Categ.</div>`}
   ${sel?`
   <div class="acopCalc">
     <div class="acopF"><span>Cantidad a desacopiar<em>quedan ${fmt(sel.cSal)} · ${sel.sub||""}</em></span>
       <span class="cfG"><input id="ac_cant" inputmode="decimal" value="${ACOPCANT}" oninput="calcAcopio()"></span></div>
     <div class="acopF"><span>Ajuste de precio<em>el acopio se compró con descuento</em></span>
       <span class="cfG"><input id="ac_pct" inputmode="decimal" value="${ACOPPCT}" oninput="calcAcopio()"><b>%</b></span></div>
     <div class="acopRes">
       <div><small>SALE DEL STOCK · AL COSTO</small><b id="ac_costo">${fmt(Math.round(cant*(sel.unit||0)))}</b></div>
       <div><small>SOBREPRECIO</small><b class="ac" id="ac_extra">${fmt(importe-Math.round(cant*(sel.unit||0)))}</b></div>
       <div><small>COSTO A LA OBRA</small><b class="tt" id="ac_total">${fmt(importe)}</b></div>
     </div>
     ${pct?`<div class="acopNota">Se van a generar <b>dos asientos</b> a la misma obra: uno por el costo, que
       descuenta el acopio, y otro por el sobreprecio, que sale de la cuenta SOBREPRECIO. Así el stock cierra exacto
       y la ganancia del acopio queda a la vista.</div>`:""}
     <div class="acopAviso" id="ac_aviso" style="display:${excede?"block":"none"}">La cantidad supera lo que queda en el acopio. Revisala.</div>
     <button class="btn navy" id="ac_btn" ${cant>0&&importe>0?"":"disabled"} onclick="aplicarAcopio()">CARGAR EL DESACOPIO</button>
   </div>`:``}`;
}
/* actualiza solo los numeros, sin tocar la tabla ni los campos: el foco no se pierde */
function calcAcopio(){
  const S=stockAcopios(), sel=ACOPSEL!==null?S[ACOPSEL]:null;
  if(!sel) return;
  ACOPCANT=$("#ac_cant").value; ACOPPCT=$("#ac_pct").value;
  const cant=parseFloat(String(ACOPCANT).replace(",","."))||0;
  const pct=parseFloat(String(ACOPPCT).replace(",","."))||0;
  const costo=Math.round(cant*(sel.unit||0));
  const total=Math.round(cant*(sel.unit||0)*(1+pct/100));
  $("#ac_costo").textContent=fmt(costo);
  $("#ac_extra").textContent=fmt(total-costo);
  $("#ac_total").textContent=fmt(total);
  $("#ac_aviso").style.display=(sel.cSal>0&&cant>sel.cSal)?"block":"none";
  $("#ac_btn").disabled=!(cant>0&&total>0);
}
function aplicarAcopio(){
  const S=stockAcopios(), sel=S[ACOPSEL];
  if(!sel) return;
  const cant=parseFloat(String(ACOPCANT).replace(",","."))||0;
  const pct=parseFloat(String(ACOPPCT).replace(",","."))||0;
  const costo=Math.round(cant*(sel.unit||0));
  const total=Math.round(cant*(sel.unit||0)*(1+pct/100));
  const extra=total-costo;
  $("#a_tcbte").value="RTO INT";
  $("#a_prov").value=sel.prov;
  $("#a_categ").value="ACOPIO"; cargarSubs(); $("#a_sub").value=sel.sub||"";
  $("#a_cant").value=cant;
  $("#a_concepto").value=`Desacopio ${sel.sub||""} · ${sel.prov}`.trim();
  $("#a_neto").value=fmt(costo);
  ACOPEXTRA = extra>0 ? {monto:extra, prov:sel.prov, sub:sel.sub, pct} : null;
  modoMov(); calcTot();
  $("#a_acopInfo").textContent=`${sel.prov} · ${sel.sub||""} · ${fmt(cant)} un. al costo${extra>0?` + ${fmt(extra)} de sobreprecio`:""}`;
  cerrarAcopios();
  const ob=$("#a_obra"); if(ob) ob.focus();
}

/* ==================== COSTO M.O. POR OBRA ====================
   Los recibos y la liquidación no saben de obras: sólo el parte diario lo sabe.
   La clave de reparto son las HORAS EQUIVALENTES de cada operario en cada obra
   (normal 1 · 50% ×1,5 · 100% ×2), aplicadas OPERARIO POR OPERARIO — nunca sobre
   el total, porque cada categoría tiene un costo por hora distinto. */
let COSTO={desde:"",hasta:"",vh:0,imp:{}};
const EQ = "hsn + hs50*1.5 + hs100*2";
function quincenaDe(f){
  const [y,m,d]=f.split("-").map(Number);
  const fin=new Date(y,m,0).getDate();
  return d<=15 ? [`${f.slice(0,8)}01`,`${f.slice(0,8)}15`] : [`${f.slice(0,8)}16`,`${f.slice(0,7)}-${fin}`];
}
function renderCosto(){
  const M=window.DATOS.maestros;
  if(!COSTO.desde){ const [a,b]=quincenaDe(hoy); COSTO.desde=a; COSTO.hasta=b; }
  const R=q(`SELECT p.legajo, o.nombre, o.categoria, p.obra, SUM(${EQ}) eq, SUM(hsn) hsn, SUM(hs50) h50, SUM(hs100) h100
    FROM parte p JOIN operario o USING(legajo) WHERE p.fecha BETWEEN ? AND ?
    GROUP BY p.legajo, p.obra HAVING eq>0 ORDER BY o.nombre`,[COSTO.desde,COSTO.hasta]);
  const obras=[...new Set(R.map(r=>r.obra))].sort();
  const legs=[...new Set(R.map(r=>r.legajo))];
  const eqDe=(l,o)=>{ const x=R.find(r=>r.legajo===l&&r.obra===o); return x?x.eq:0; };
  const eqTot=l=>R.filter(r=>r.legajo===l).reduce((a,r)=>a+r.eq,0);
  const impDe=l=>+(COSTO.imp[l]||0);
  /* reparto: el importe de CADA operario se abre según SUS horas equivalentes */
  const plata=(l,o)=>{ const t=eqTot(l); return t? impDe(l)*eqDe(l,o)/t : 0; };
  const porObra=o=>legs.reduce((a,l)=>a+plata(l,o),0);
  const eqObra=o=>R.filter(r=>r.obra===o).reduce((a,r)=>a+r.eq,0);
  const eqGral=R.reduce((a,r)=>a+r.eq,0), impGral=legs.reduce((a,l)=>a+impDe(l),0);
  const n2=x=>Math.round(x*100)/100;
  const pct=x=>eqGral?((x/eqGral)*100).toFixed(1)+"%":"—";
  $("#app").innerHTML=`
  <div class="barra">
    <label class="coLab">DESDE<input type="date" value="${COSTO.desde}" onchange="COSTO.desde=this.value;renderCosto()"></label>
    <label class="coLab">HASTA<input type="date" value="${COSTO.hasta}" onchange="COSTO.hasta=this.value;renderCosto()"></label>
    <button class="mini" onclick="costoAplicar()">APLICAR ESCALA DE CONFIG.</button>
    <button class="mini ed" onclick="costoLimpiar()">LIMPIAR IMPORTES</button>
    <div class="sigma"><span class="sgTit">Σ A DISTRIBUIR</span>
      <span class="mx"><small>hs equiv.</small><b>${n2(eqGral)}</b></span>
      <span class="mx"><small>operarios</small><b>${legs.length}</b></span>
      <span class="mx"><small>importe</small><b class="tot">${fmt(impGral)}</b></span></div>
  </div>
  <div class="coWrap">
   <div class="coCard">
    <div class="pcTit">COSTO IMPUTADO A CADA OBRA</div>
    <table class="coTab"><thead><tr><th>OBRA</th><th class="num">HS EQUIV.</th><th class="num">%</th><th class="num">IMPORTE</th></tr></thead>
     <tbody>${obras.map(o=>`<tr><td><b>${o}</b></td><td class="num">${n2(eqObra(o))}</td>
       <td class="num g">${pct(eqObra(o))}</td><td class="num tot">${fmt(porObra(o))}</td></tr>`).join("")}
      <tr class="coTot"><td>TOTAL</td><td class="num">${n2(eqGral)}</td><td class="num">100%</td><td class="num">${fmt(legs.reduce((a,l)=>a+obras.reduce((b,o)=>b+plata(l,o),0),0))}</td></tr>
     </tbody></table>
    <div class="pcNota">Cada operario reparte <b>su</b> importe según <b>sus</b> horas. Por eso el % de horas y el % de plata no coinciden: un oficial en Pavimento pesa más por hora que un ayudante en Depósito.</div>
   </div>
   <div class="coCard">
    <div class="pcTit">CLAVE DE REPARTO POR OPERARIO</div>
    <table class="coTab"><thead><tr><th class="num">LEG</th><th>OPERARIO</th>${obras.map(o=>`<th class="num">${o}</th>`).join("")}
      <th class="num">HS EQUIV.</th><th class="num">IMPORTE QUINCENA</th></tr></thead>
     <tbody>${legs.map(l=>{ const r0=R.find(r=>r.legajo===l);
       return `<tr><td class="num g">${l}</td><td><b>${r0.nombre}</b><br><small class="g">${r0.categoria||""}</small></td>
       ${obras.map(o=>{const e=eqDe(l,o); return `<td class="num ${e?'':'g'}">${e?n2(e):"·"}</td>`}).join("")}
       <td class="num"><b>${n2(eqTot(l))}</b></td>
       <td class="num"><input class="coImp numIn" id="ci_${l}" inputmode="numeric" value="${fmt(impDe(l))}" oninput="costoSet(${l},this)"></td></tr>`}).join("")}
     </tbody></table>
    <div class="pcNota">El importe sale de la liquidación de la quincena: jornales + cargas de <b>ese</b> operario. Mientras la liquidación no esté integrada, se carga acá o se estima con el valor hora.</div>
   </div>
   <div class="coCard coGen">
    <div class="pcTit">GENERAR LOS ASIENTOS EN LA PLANILLA DE CARGA</div>
    <div class="coGenF">
      <label class="coLab">CUENTA<select id="co_cta">${M.cuentas.map(c=>`<option ${c===cfg("ctaBco")?"selected":""}>${c}</option>`).join("")}</select></label>
      <label class="coLab">TIPO DE PAGO<select id="co_tipo">${M.tipos.map(c=>`<option>${c}</option>`).join("")}</select></label>
      <label class="coLab">FECHA DE PAGO<input type="date" id="co_fec" value="${hoy}"></label>
      <button class="mini" onclick="costoGenerar()">GENERAR ${obras.length} ASIENTOS</button>
    </div>
    <div id="co_msg" class="pcNota">Se crea <b>un movimiento por obra</b> con su parte del costo, categoría Mano Obra y sub Jornales. Cada uno queda registrado en la AUDITORÍA como alta automática.</div>
   </div>
  </div>`;
}
function costoSet(l,el){ sepMil(el); COSTO.imp[l]=parseFloat(el.value.replace(/\./g,""))||0; renderConFoco(renderCosto); }
function costoAplicar(){
  const R=q(`SELECT p.legajo, o.categoria, SUM(${EQ}) eq FROM parte p JOIN operario o USING(legajo)
    WHERE p.fecha BETWEEN ? AND ? GROUP BY p.legajo`,[COSTO.desde,COSTO.hasta]);
  COSTO.imp={};
  R.forEach(r=>{ if(r.eq<=0) return;
    const e=q("SELECT vh FROM escala WHERE categoria=?",[r.categoria]);
    COSTO.imp[r.legajo]=Math.round(r.eq*(e.length?e[0].vh:0)); });
  renderCosto();
}
function costoLimpiar(){ COSTO.imp={}; renderCosto(); }
function costoGenerar(){
  const M=window.DATOS.maestros;
  const R=q(`SELECT p.legajo, p.obra, SUM(${EQ}) eq FROM parte p WHERE p.fecha BETWEEN ? AND ?
    GROUP BY p.legajo, p.obra HAVING eq>0`,[COSTO.desde,COSTO.hasta]);
  const legs=[...new Set(R.map(r=>r.legajo))];
  const eqTot=l=>R.filter(r=>r.legajo===l).reduce((a,r)=>a+r.eq,0);
  const obras=[...new Set(R.map(r=>r.obra))].sort();
  const monto={}; obras.forEach(o=>monto[o]=0);
  legs.forEach(l=>{ const t=eqTot(l), im=+(COSTO.imp[l]||0); if(!t||!im) return;
    R.filter(r=>r.legajo===l).forEach(r=>monto[r.obra]+=im*r.eq/t); });
  const total=obras.reduce((a,o)=>a+monto[o],0);
  if(!total){ $("#co_msg").innerHTML='<b style="color:#C0392B">Cargá los importes de la quincena antes de generar.</b>'; return; }
  const cta=$("#co_cta").value, tipo=$("#co_tipo").value, fec=$("#co_fec").value;
  const per=`${COSTO.desde.slice(8)}/${COSTO.desde.slice(5,7)} al ${COSTO.hasta.slice(8)}/${COSTO.hasta.slice(5,7)}`;
  if(!confirm(`Se generan ${obras.length} asientos por ${fmt(Math.round(total))} en total, quincena ${per}.`)) return;
  const ia=DB.prepare("INSERT INTO audit(ts,usuario,accion,mov_id,campo,antes,despues) VALUES(?,?,?,?,?,?,?)");
  obras.forEach(o=>{
    const im=Math.round(monto[o]); if(!im) return;
    DB.run(`INSERT INTO mov(cuenta,tipo,tcbte,emis,pago,concepto,neto,categ,sub,obra,etapa) VALUES(?,?,?,?,?,?,?,?,?,?,?)`,
      [cta,tipo,"RECIBO",fec,fec,`M.O. quincena ${per} · ${o}`,im,"Mano Obra",cfg("subRbo","Jornales"),o,cfg("etapaDef")||null]);
    const id=q("SELECT MAX(id) m FROM mov")[0].m;
    ia.run([ahora(),USUARIO,"ALTA AUTOM.",id,"distribución M.O.",`quincena ${per} · ${o}`,String(im)]);
  });
  ia.free();
  $("#co_msg").innerHTML=`<b style="color:#375623">Listo: ${obras.length} asientos por ${fmt(Math.round(total))} cargados en la planilla, uno por obra.</b>`;
}

/* ==================== PARTE DIARIO — CARGA MÓVIL ====================
   Modelo: la jornada de un operario son TRAMOS. Cada tramo = una obra con
   su hora de entrada y de salida. Si lo reasignan, se cierra el tramo y se
   abre otro. Las horas extra se reparten sobre el TOTAL DEL DÍA, no por tramo. */
const DIAS=["DOMINGO","LUNES","MARTES","MIÉRCOLES","JUEVES","VIERNES","SÁBADO"];
const MESES=["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
let MOBV="hoy", MOBACC="ing", MOBOBRA="", MOBHORA="", MOBSEL=new Set(), MOBQ="", MOBID=null, MOBAVISO="";
const toMin = t => { const [h,m]=String(t||"0:0").split(":").map(Number); return h*60+m; };
const hhmm  = m => `${String(Math.floor((((m%1440)+1440)%1440)/60)).padStart(2,"0")}:${String(((m%60)+60)%60).padStart(2,"0")}`;
const hsTxt = m => `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`;
function relojSel(id,val,onch){
  const [hh,mm]=(val||"00:00").split(":");
  const op=(n,s)=>`<option ${n===s?"selected":""}>${n}</option>`;
  const H=[...Array(24)].map((_,i)=>String(i).padStart(2,"0"));
  const Mi=[...Array(12)].map((_,i)=>String(i*5).padStart(2,"0"));
  if(!Mi.includes(mm)){ Mi.push(mm); Mi.sort(); }
  return `<span class="mReloj">
    <span class="mRw"><select id="${id}_h" onchange="${onch}">${H.map(x=>op(x,hh)).join("")}</select><em>HS</em></span>
    <i>:</i>
    <span class="mRw"><select id="${id}_m" onchange="${onch}">${Mi.map(x=>op(x,mm)).join("")}</select><em>MIN</em></span></span>`;
}
const leerReloj = id => $("#"+id+"_h").value+":"+$("#"+id+"_m").value;
function ponerReloj(id,v){ const [a,b]=v.split(":"); $("#"+id+"_h").value=a; $("#"+id+"_m").value=b; }
const relojAhora = () => { const d=new Date(); return hhmm((Math.round((d.getHours()*60+d.getMinutes())/5)*5)%1440); };
function fechaLarga(f){ const [y,m,d]=f.split("-").map(Number); const dt=new Date(y,m-1,d);
  return {dow:DIAS[dt.getDay()], txt:`${d} de ${MESES[m-1]}`, yy:String(y).slice(2), domingo:dt.getDay()===0}; }
function diaCerrado(){ return q("SELECT 1 c FROM cierre WHERE fecha=? AND obra='TODAS'",[hoy]).length>0; }
function tramosHoy(){ return q(`SELECT p.*, o.nombre, o.categoria, o.foto FROM parte p JOIN operario o USING(legajo)
  WHERE p.fecha=? ORDER BY p.obra, o.nombre, p.ent`,[hoy]); }
const minTramo = t => t.sal ? Math.max(0,toMin(t.sal)-toMin(t.ent||t.sal)) : 0;
/* reparte normales / 50% / 100% sobre el total del día, tramo por tramo en orden */
function recalcDia(legajo){
  const dom=fechaLarga(hoy).domingo;
  const tr=q("SELECT * FROM parte WHERE fecha=? AND legajo=? AND sal IS NOT NULL ORDER BY ent",[hoy,legajo]);
  let acum=0;
  for(const t of tr){
    const hs=minTramo(t)/60; let hsn=0,h50=0,h100=0;
    if(dom) h100=hs; else { const resto=Math.max(0,8-acum); hsn=Math.min(hs,resto); h50=hs-hsn; }
    acum+=hs;
    DB.run("UPDATE parte SET hsn=?,hs50=?,hs100=? WHERE id=?",[+hsn.toFixed(2),+h50.toFixed(2),+h100.toFixed(2),t.id]);
  }
}

     :`<div class="mVacio"><div class="mIc"></div><b>Todavía no marcaste a nadie</b>

              <button class="mBt v" onclick="mobCerrar()">CERRAR EL DÍA<small>FIRMA ${CAPATAZ.nombre}</small></button>`))}</div>

function mobAbrir(acc){
  MOBACC=acc; MOBV="sel"; MOBQ=""; MOBOBRA=""; MOBAVISO=""; MOBHORA=relojAhora(); MOBSEL=new Set();
  const T=tramosHoy(), abiertos=T.filter(t=>!t.sal);
  if(acc==="ing"){
    const enObra=abiertos.map(t=>t.legajo);
    const ult=q("SELECT MAX(fecha) f FROM parte WHERE fecha<?",[hoy])[0].f;
    if(ult) q("SELECT DISTINCT legajo FROM parte WHERE fecha=?",[ult]).forEach(x=>{ if(!enObra.includes(x.legajo)) MOBSEL.add(x.legajo); });
  } else if(acc==="sal") abiertos.forEach(t=>MOBSEL.add(t.legajo));
  renderMobil();
}

    <div class="mPaso">${PASO}</div>
   </div>
   ${!sigue?`<div class="mHbar" style="margin-top:12px">
     <div><div class="mEt">HORA DE SALIDA</div>${relojSel("mh",MOBHORA,"MOBHORA=leerReloj('mh');renderMobil()")}</div>
     <div class="mStep"><b onclick="mobPaso(-5)">−</b><b onclick="mobPaso(5)">+</b></div>
   </div>`:`<div style="height:12px"></div>`}
   <input class="mBuscar" id="mBuscar" placeholder="🔍 Legajo o apellido" value="${MOBQ}" oninput="MOBQ=this.value;renderConFoco(renderMobil)">
   <div class="mChips">

/* ---------- CONFIRMACIONES ---------- */
function mobTick(l){ MOBSEL.has(l)?MOBSEL.delete(l):MOBSEL.add(l); renderMobil(); }
function mobTodos(on){
  MOBSEL=new Set();
  if(on){ const T=tramosHoy(), enObra=T.filter(t=>!t.sal).map(t=>t.legajo);
    if(MOBACC==="ing") q("SELECT legajo FROM operario").forEach(o=>{ if(!enObra.includes(o.legajo)) MOBSEL.add(o.legajo); });
    else T.filter(t=>!t.sal).forEach(t=>MOBSEL.add(t.legajo)); }
  renderMobil();
}
function mobPaso(d){ MOBHORA=hhmm(toMin(MOBHORA)+d); renderMobil(); }
function mobConfirmar(){
  const T=tramosHoy(), abiertos=T.filter(t=>!t.sal);
  if(MOBACC==="ing"){
    const st=DB.prepare("INSERT INTO parte(fecha,legajo,obra,ent) VALUES(?,?,?,?)");
    [...MOBSEL].forEach(l=>st.run([hoy,l,MOBOBRA,MOBHORA])); st.free();
  }
  if(MOBACC==="sal"){
    for(const t of abiertos){ if(!MOBSEL.has(t.legajo)) continue;
      if(toMin(MOBHORA)<=toMin(t.ent)) continue;
      DB.run("UPDATE parte SET sal=? WHERE id=?",[MOBHORA,t.id]); recalcDia(t.legajo); }
  }
  if(MOBACC==="reas"){
    let saltados=0;
    for(const t of abiertos){ if(!MOBSEL.has(t.legajo)) continue;
      if(t.obra===MOBOBRA || toMin(MOBHORA)<=toMin(t.ent)){ saltados++; continue; }
      DB.run("UPDATE parte SET sal=? WHERE id=?",[MOBHORA,t.id]);
      DB.run("INSERT INTO parte(fecha,legajo,obra,ent) VALUES(?,?,?,?)",[hoy,t.legajo,MOBOBRA,MOBHORA]);
      recalcDia(t.legajo); }
    if(saltados){ MOBAVISO=`${saltados} sin mover: ya estaban en esa obra o la hora es anterior a su ingreso.`; renderMobil(); return; }
  }
  MOBSEL=new Set(); MOBOBRA=""; MOBAVISO=""; MOBV="hoy"; renderMobil();
}

/* ---------- CORRECCIÓN DE UN TRAMO ---------- */
function mobEditar(id){ MOBID=id; MOBV="edit"; renderMobil(); }
function mobEdit(){
  const M=window.DATOS.maestros;
  const r=q("SELECT p.*, o.nombre, o.categoria FROM parte p JOIN operario o USING(legajo) WHERE p.id=?",[MOBID])[0];
  if(!r){ MOBV="hoy"; return renderMobil(); }
  const ent=r.ent||"07:00", sal=r.sal||relojAhora();
  const otros=q("SELECT * FROM parte WHERE fecha=? AND legajo=? AND id<>?",[hoy,r.legajo,MOBID]);
  const totDia=otros.reduce((a,t)=>a+minTramo(t),0);
  $("#app").innerHTML=`<div class="mob"><div class="mScr">
   <div class="mHead" style="padding-bottom:14px">
    <div class="mDow">LEGAJO ${r.legajo}</div>
    <div class="mFecha" style="font-size:26px">${r.nombre}</div>
    <div class="mQuien">${r.categoria||""}${otros.length?` · ${otros.length} tramo${otros.length>1?"s":""} más hoy (${hsTxt(totDia)} hs)`:""}</div>
   </div>
   <div class="mHbar" style="margin-top:13px">
    <div style="flex:1"><div class="mEt">OBRA DEL TRAMO</div>
      <select class="mSelObra" id="e_obra">${M.obras.map(o=>`<option ${o===r.obra?"selected":""}>${o}</option>`).join("")}</select></div>
   </div>
   <div class="mHbar">
    <div><div class="mEt">ENTRADA</div>${relojSel("e_ent",ent,"mobCalc()")}</div>
    <div class="mStep"><b onclick="mobPasoC('e_ent',-5)">−</b><b onclick="mobPasoC('e_ent',5)">+</b></div>
   </div>
   <div class="mHbar">
    <div><div class="mEt">SALIDA${r.sal?"":" (todavía en obra)"}</div>${relojSel("e_sal",sal,"mobCalc()")}</div>
    <div class="mStep"><b onclick="mobPasoC('e_sal',-5)">−</b><b onclick="mobPasoC('e_sal',5)">+</b></div>
   </div>
   <div class="mTotal" style="margin-top:4px"><div><small>HORAS DE ESTE TRAMO</small><b id="e_hs">${hsTxt(Math.max(0,toMin(sal)-toMin(ent)))}</b></div>
     <div style="font-size:12.5px;color:#DBF0C3">se recalcula solo</div></div>
   <div class="mLista" style="padding-top:14px"><div style="font-size:12.5px;color:#6B7684;line-height:1.55">
     Guardar cierra el tramo con esa salida. Las horas extra del día se reparten sobre el total, no sobre cada tramo.</div>
     <div style="margin-top:14px"><button class="mBt g wfull" style="color:#9B2C2C;border-color:#E3BDBD" onclick="mobBorrar()">QUITAR ESTE TRAMO</button></div>
   </div>
   <div class="mPie">
     <button class="mBt g" onclick="MOBV='hoy';renderMobil()">VOLVER</button>
     <button class="mBt v" onclick="mobGuardar()">GUARDAR</button>
   </div>
  </div></div>`;
}
function mobCalc(){ $("#e_hs").textContent=hsTxt(Math.max(0,toMin(leerReloj("e_sal"))-toMin(leerReloj("e_ent")))); }
function mobPasoC(id,d){ ponerReloj(id,hhmm(toMin(leerReloj(id))+d)); mobCalc(); }
function mobGuardar(){
  const r=q("SELECT legajo FROM parte WHERE id=?",[MOBID])[0];
  DB.run("UPDATE parte SET obra=?,ent=?,sal=? WHERE id=?",[$("#e_obra").value,leerReloj("e_ent"),leerReloj("e_sal"),MOBID]);
  recalcDia(r.legajo); MOBV="hoy"; renderMobil();
}
function mobBorrar(){
  if(!confirm("¿Quitar este tramo del parte del día?")) return;
  const r=q("SELECT legajo FROM parte WHERE id=?",[MOBID])[0];
  DB.run("DELETE FROM parte WHERE id=?",[MOBID]); recalcDia(r.legajo);
  MOBV="hoy"; renderMobil();
}
function mobCerrar(){ DB.run("INSERT OR REPLACE INTO cierre VALUES(?,?,?,?)",[hoy,"TODAS",CAPATAZ.nombre,ahora()]); renderMobil(); }
function mobReabrir(){ DB.run("DELETE FROM cierre WHERE fecha=? AND obra='TODAS'",[hoy]); renderMobil(); }

/* ==================== PARTE DIARIO — PLANILLA DEL ADMINISTRATIVO ====================
   Lo que cierra el capataz en el celular aterriza acá. Los casilleros de
   ADICIONALES y ADELANTOS quedan pendientes, resaltados, hasta que alguien
   los carga o los marca en cero. Es el paso previo obligatorio a liquidar. */
let PD={desde:"",hasta:"",obra:"",pend:false};
function renderDiario(){
  const M=window.DATOS.maestros;
  if(!PD.desde){ const [a,b]=quincenaDe(hoy); PD.desde=a; PD.hasta=b; }
  const wh=["p.fecha BETWEEN ? AND ?"], pr=[PD.desde,PD.hasta];
  if(PD.obra){ wh.push("p.obra=?"); pr.push(PD.obra); }
  if(PD.pend) wh.push("c.fecha IS NOT NULL AND (p.adic IS NULL OR p.adel IS NULL)");
  const rows=q(`SELECT p.*, o.nombre, o.categoria, (p.hsn+p.hs50+p.hs100) hs, c.fecha cerr, c.usuario firma
    FROM parte p JOIN operario o USING(legajo)
    LEFT JOIN cierre c ON c.fecha=p.fecha AND c.obra='TODAS'
    WHERE ${wh.join(" AND ")} ORDER BY p.fecha DESC, o.nombre, p.ent`,pr);
  const S=q(`SELECT COUNT(*) n, COALESCE(SUM(hsn),0) hsn, COALESCE(SUM(hs50),0) h50, COALESCE(SUM(hs100),0) h100,
    COALESCE(SUM(adic),0) adic, COALESCE(SUM(adel),0) adel FROM parte p WHERE ${wh.join(" AND ").replace(/c\.fecha IS NOT NULL AND /,"")}
    ${PD.pend?"AND (p.adic IS NULL OR p.adel IS NULL)":""}`,pr)[0];
  const pend=rows.filter(r=>r.cerr && (r.adic===null||r.adel===null)).length;
  const abiertos=rows.filter(r=>!r.cerr).length;
  const dup=q(`SELECT COUNT(*) c FROM (SELECT legajo,fecha,obra FROM parte WHERE fecha BETWEEN ? AND ? GROUP BY legajo,fecha,obra HAVING COUNT(*)>1)`,[PD.desde,PD.hasta])[0].c;
  const h12=q(`SELECT COUNT(*) c FROM (SELECT legajo,fecha FROM parte WHERE fecha BETWEEN ? AND ? GROUP BY legajo,fecha HAVING SUM(hsn+hs50+hs100)>12)`,[PD.desde,PD.hasta])[0].c;
  const celda=(r,campo)=>{
    const v=r[campo], pte = r.cerr && v===null;
    return `<td class="num ${pte?'pdPte':'zV'}"><input class="pdIn numIn ${pte?'pte':''}" inputmode="numeric"
      value="${v===null?"":fmt(v)}" placeholder="${pte?"pendiente":""}"
      onchange="pdSet(${r.id},'${campo}',this)" oninput="sepMil(this)"></td>`;
  };
  $("#app").innerHTML=`
  <div class="barra">
    <label class="coLab">DESDE<input type="date" value="${PD.desde}" onchange="PD.desde=this.value;renderDiario()"></label>
    <label class="coLab">HASTA<input type="date" value="${PD.hasta}" onchange="PD.hasta=this.value;renderDiario()"></label>
    <label class="coLab">OBRA<select onchange="PD.obra=this.value;renderDiario()">
      <option value="">· TODAS ·</option>${M.obras.map(o=>`<option ${o===PD.obra?"selected":""}>${o}</option>`).join("")}</select></label>
    <button class="mini ${PD.pend?'ed':'gris'}" onclick="PD.pend=!PD.pend;renderDiario()">${PD.pend?"● ":""}SÓLO PENDIENTES</button>
    <button class="mini" onclick="pdSinAdic()">MARCAR SIN ADICIONALES</button>
    <div class="sigma"><span class="sgTit">Σ PERÍODO</span>
      <span class="mx"><small>jornadas</small><b>${S.n}</b></span>
      <span class="mx"><small>hs norm.</small><b>${fmt(S.hsn)}</b></span>
      <span class="mx"><small>hs 50%</small><b>${fmt(S.h50)}</b></span>
      <span class="mx"><small>hs 100%</small><b>${fmt(S.h100)}</b></span>
      <span class="mx"><small>adicionales</small><b class="tot">${fmt(S.adic)}</b></span>
      <span class="mx"><small>adelantos</small><b>${fmt(S.adel)}</b></span></div>
  </div>
  ${pend||abiertos||dup||h12?`<div class="pdAvisos">
    ${pend?`<span class="pdAv amb">⚠ ${pend} jornada${pend===1?"":"s"} cerrada${pend===1?"":"s"} sin adicionales cargados — hay que resolverlas antes de liquidar</span>`:""}
    ${abiertos?`<span class="pdAv gris">${abiertos} jornada${abiertos===1?"":"s"} de días que el capataz todavía no cerró</span>`:""}
    ${dup?`<span class="pdAv rojo">⚠ ${dup} duplicado${dup===1?"":"s"} legajo+fecha+obra</span>`:""}
    ${h12?`<span class="pdAv rojo">⚠ ${h12} día${h12===1?"":"s"} con más de 12 hs</span>`:""}
  </div>`:""}
  <div class="tablaWrap"><table class="carga pdTab">
   <colgroup><col style="width:7ch"><col style="width:5.5ch"><col style="width:20ch"><col style="width:14ch">
     <col style="width:6ch"><col style="width:6ch"><col style="width:8ch"><col style="width:8ch"><col style="width:8ch">
     <col style="width:14ch"><col style="width:14ch"><col style="width:13ch"></colgroup>
   <thead><tr><th>FECHA</th><th class="num">LEG.</th><th>OPERARIO</th><th>OBRA</th><th class="num">ENT</th><th class="num">SAL</th>
     <th class="num">HS<br>NORM.</th><th class="num">HS<br>50%</th><th class="num">HS<br>100%</th><th class="num">ADICIONALES $</th><th class="num">ADELANTOS $</th><th>ESTADO</th></tr></thead>
   <tbody>${rows.map(r=>`<tr>
     <td class="zF">${r.fecha.slice(5)}</td><td class="num g">${r.legajo}</td>
     <td class="zV">${r.nombre}</td><td class="zV">${r.obra}</td>
     <td class="num zF">${r.ent||"—"}</td><td class="num zF">${r.sal||"—"}</td>
     <td class="num zS">${r.hsn||""}</td><td class="num zS">${r.hs50||""}</td><td class="num zS">${r.hs100||""}</td>
     ${celda(r,"adic")}${celda(r,"adel")}
     <td class="${r.cerr?'pdOk':'pdAb'}">${r.cerr?`CERRADO<br><small>${r.firma||""}</small>`:"ABIERTO"}</td>
   </tr>`).join("")}</tbody></table></div>
  <div class="cards">${rows.slice(0,60).map(r=>`<div class="card"><div class="cTop"><b>${r.nombre}</b><span>${r.fecha.slice(5)}</span></div>
   <div class="cSub">${r.obra} · ${r.ent||"—"} → ${r.sal||"—"} · ${r.hs} hs</div>
   <div class="cSub">${r.cerr?(r.adic===null||r.adel===null?"<b style='color:#B7791F'>faltan adicionales</b>":"adic "+fmt(r.adic)+" · adel "+fmt(r.adel)):"jornada abierta"}</div>
  </div>`).join("")}</div>`;
}
function pdSet(id,campo,el){
  const t=el.value.replace(/\./g,"").trim();
  const v = t==="" ? null : (parseFloat(t)||0);
  const ant=q("SELECT adic,adel FROM parte WHERE id=?",[id])[0];
  DB.run(`UPDATE parte SET ${campo}=? WHERE id=?`,[v,id]);
  DB.run("INSERT INTO audit(ts,usuario,accion,mov_id,campo,antes,despues) VALUES(?,?,?,?,?,?,?)",
    [ahora(),USUARIO,"PARTE",id,campo==="adic"?"adicionales":"adelantos",
     ant[campo]===null?"pendiente":String(ant[campo]), v===null?"pendiente":String(v)]);
  renderDiario();
}
function pdSinAdic(){
  const wh=["fecha BETWEEN ? AND ?"], pr=[PD.desde,PD.hasta];
  if(PD.obra){ wh.push("obra=?"); pr.push(PD.obra); }
  const ids=q(`SELECT p.id FROM parte p JOIN cierre c ON c.fecha=p.fecha AND c.obra='TODAS'
    WHERE ${wh.map(x=>"p."+x.replace("fecha BETWEEN ? AND ?","fecha BETWEEN ? AND ?")).join(" AND ")}
    AND (p.adic IS NULL OR p.adel IS NULL)`,pr).map(x=>x.id);
  if(!ids.length){ alert("No hay jornadas cerradas pendientes en el período."); return; }
  if(!confirm(`Se marcan ${ids.length} jornada(s) en CERO adicionales y CERO adelantos.\nSólo alcanza a días ya cerrados por el capataz.`)) return;
  const ia=DB.prepare("INSERT INTO audit(ts,usuario,accion,mov_id,campo,antes,despues) VALUES(?,?,?,?,?,?,?)");
  ids.forEach(id=>{ DB.run("UPDATE parte SET adic=COALESCE(adic,0), adel=COALESCE(adel,0) WHERE id=?",[id]);
    ia.run([ahora(),USUARIO,"PARTE",id,"sin adicionales","pendiente","0"]); });
  ia.free(); renderDiario();
}

/* Al entrar a un campo numérico se resalta todo el valor: se tipea encima y reemplaza.
   Delegado en document porque las pantallas se redibujan enteras en cada render. */
document.addEventListener("focusin", e=>{
  const el=e.target;
  if(!el.matches || !el.matches('input[inputmode="numeric"], input[type="number"]')) return;
  setTimeout(()=>{ try{ el.select(); }catch(_){ } },0);
});
document.addEventListener("click", e=>{
  const el=e.target;
  if(el.matches && el.matches('input[inputmode="numeric"], input[type="number"]')
     && el.selectionStart===el.selectionEnd) el.select();
});
const TITULOS={menu:"GESTIÓN CONSTRUCTORA", carga:"PLANILLA de CARGA GENERAL",
  mobil:"PARTE DIARIO · CARGA MÓVIL", plan:"PLAN DE CUENTAS · MAESTROS",
  costo:"COSTO DE MANO DE OBRA x OBRA", horas:"HORAS DE LA QUINCENA · PARA EL CONTADOR", pago:"PAGO DE LA QUINCENA", aport:"APORTES Y CONTRIBUCIONES M.O.", cert:"CERTIFICADO DEL MES", fondo:"FONDO DE RESERVA · CUENTA CORRIENTE", graf:"GRÁFICOS DEL MES", legajos:"· LEGAJOS — PADRÓN DE OPERARIOS",
  conf:"· CONFIGURACIÓN — LIQUIDACIÓN M.O.", diario:"PARTE DIARIO DE OBRA"};
function nav(v){ VISTA=v; $("#tit").textContent = v==="rep" ? RPT[RPTTIPO].tit : (v==="fin" ? FIN[FINTIPO].tit : (TITULOS[v]||"PARTE DIARIO DE OBRA"));
  $("#volver").style.display = v==="menu"?"none":"inline-block";
  $("#lupa").style.display = v==="carga"?"inline-block":"none";
  if(v!=="carga"){ $("#busq").value=""; $("#busq").style.display="none"; $("#nRes").style.display="none"; $("#lupa").classList.remove("on"); busca=""; }
  if(v==="menu") renderMenu(); else if(v==="carga") renderCarga(); else if(v==="mobil"){ MOBV="hoy"; renderMobil(); } else if(v==="plan") renderPlan(); else if(v==="costo") renderCosto(); else if(v==="rep") renderRep(); else if(v==="fin") renderFin(); else if(v==="horas") renderHoras(); else if(v==="pago") renderPago(); else if(v==="aport") renderAportes(); else if(v==="cert") renderCert(); else if(v==="fondo") renderFondo(); else if(v==="graf") renderGraficos(); else if(v==="legajos") renderLegajos(); else if(v==="conf") renderConf(); else renderDiario(); }
function prox(){ alert("Próxima etapa — este módulo se construye sobre esta misma base."); }
window.arrancar = async function(){
  const SQL = await initSqlJs({locateFile: f => "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/" + f});
  DB = new SQL.Database();
  bootSchema(window.DATOS);
  nav("menu");
};
</script>
<script>arrancar();</script>
